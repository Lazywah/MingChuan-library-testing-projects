# ==============================================================================
# ZH: AI 訓練平台 - Nginx 反向代理設定
# EN: AI Training Platform - Nginx Reverse Proxy Configuration
# ZH: 用途：統一入口、路由分發、WebSocket 支援、健康檢查
# EN: Purpose: Single entry point, routing, WebSocket support, health check
#
# ZH: 路由規則：
# EN: Routing rules:
#   /                    → Open WebUI (:8080)  ZH: 聊天介面 | EN: Chat UI
#   /api/v1/auth/*       → Job Scheduler (:8000) ZH: 認證 API | EN: Auth API
#   /api/v1/jobs/*       → Job Scheduler (:8000) ZH: 任務 API | EN: Jobs API
#   /health              → 200 OK               ZH: 健康檢查 | EN: Health check
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ZH: 請求體大小限制 (支援大型資料集上傳) | EN: Request body size limit
    client_max_body_size 10G;

    # ==================================================================
    # ZH: 上游服務定義 | EN: Upstream service definitions
    #
    # ZH: 🔴 **刻意不用 `upstream {}` 區塊。**
    #     nginx 對 `upstream` 裡的主機名**只在啟動時解析一次**。
    #     job-scheduler 容器一旦重啟就會拿到新 IP，而 nginx 還在打舊的 ——
    #     結果是**整個 API 全部 502**，直到 nginx 也重啟為止。
    #
    # ZH: 這不是理論問題：`docs/00` 教維運人員用
    #         docker compose up -d job-scheduler
    #     重載設定，照做就會把整個平台打掛。
    #     2026-08-27 稽核實測重現：nginx 打 172.21.0.3、容器實際在 172.21.0.2，
    #     錯誤訊息是 `connect() failed (111: Connection refused)`。
    #
    # ZH: 改法：把位址放進**變數**，nginx 就會在每次請求時經由下面的
    #     `resolver`（Docker 內部 DNS）重新解析。這與 open-webui 用的是
    #     同一套做法（見 `set $open_webui`），只是它一直沒套用到後端 API。
    #
    # ZH: ⚠ 用變數之後 nginx **不會**自動接上原始 URI，
    #     所以每個 proxy_pass 都必須自己接 `$request_uri`（原本就是這樣寫的）。
    # EN: Deliberately NOT an `upstream {}` block — nginx resolves those once at
    #     startup, so a container restart yields platform-wide 502s.
    # ==================================================================

    # ZH: Docker 內部 DNS，讓 open-webui 可在未啟動時延遲解析，避免 nginx 啟動失敗
    # EN: Docker internal DNS so open-webui resolves lazily even if not running
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # ZH: 後端位址放變數 → 每次請求重新解析（理由見上方註解）
        set $scheduler "http://job-scheduler:8000";

        # ==================================================================
        # ZH: 認證 API 路由 | EN: Auth API routing
        # v2.1 修正：regex 同時匹配 /api/v1/auth 與 /api/v1/auth/ (含子路徑)
        # 配合 FastAPI redirect_slashes=False，避免有/無斜線兩端互打 307
        # ==================================================================
        location ~ ^/api/v1/auth(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # SSO API 路由
        # ==================================================================
        location ~ ^/api/v1/sso(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: 資料集 API 路由 | EN: Datasets API routing
        # ==================================================================
        location ~ ^/api/v1/datasets(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v2.4 動態模型清單（各 AI 工具下拉依 tool_type 抓取）
        # EN: v2.4 dynamic model list (per-tool dropdowns)
        # ==================================================================
        location ~ ^/api/v1/models(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZH: v2.5 外部 AI 分流（使用者 /me 導流；admin 對應表走 /external-ai/admin/*）
        # EN: v2.5 External AI routing (user /me; admin mapping under /external-ai/admin/*)
        location ~ ^/api/v1/external-ai(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZH: v2.6 RAG 客服/導覽助手（/ask 為 SSE 串流，須關 buffering；公開免登入）
        # EN: v2.6 RAG support/guide assistant (/ask is SSE; buffering off; public)
        location ~ ^/api/v1/assistant(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # ==================================================================
        # ZH: 任務 SSE 串流（M1 修復：必須關閉 buffering 以免延遲）
        # EN: Job SSE stream (M1 fix: disable buffering to avoid latency)
        # ZH: 正則優先匹配 /api/v1/jobs/{uuid}/stream
        # EN: Regex matches /api/v1/jobs/{uuid}/stream first
        # ==================================================================
        location ~* ^/api/v1/jobs/[^/]+/stream$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;        # ZH: SSE 長連線 | EN: Long-lived SSE
        }

        # ==================================================================
        # ZH: 任務排程 API 路由 | EN: Job Scheduler API routing
        # v2.1 修正：regex 匹配有/無斜線，且 /jobs/{id}/stream 的 SSE location
        # (前面 ~* ^/api/v1/jobs/[^/]+/stream$) 仍會優先匹配 (regex 依檔案順序)
        # ==================================================================
        location ~ ^/api/v1/jobs(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: AI 助手 API 路由 (串流代理) | EN: AI Assistant API routing
        # ==================================================================
        location ~ ^/api/v1/chat(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ZH: 支援串流輸出 (SSE) | EN: Support streaming output
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # ==================================================================
        # ZH: Notebook 路由已於 Phase E 移除（v1 偽 Notebook 由 v2.0 Lab 取代）
        # EN: Notebook routes removed in Phase E (v1 superseded by v2.0 Lab)
        # ==================================================================

        # ==================================================================
        # ZH: v2.0 Lab 模組 — Session 管理、Secrets、配額 API
        # EN: v2.0 Lab module — session/secrets/quota API
        # ==================================================================
        location ~ ^/api/v1/lab(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/secrets(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v2.2 公告 API（user 端讀首頁公告） | EN: v2.2 announcements (user homepage)
        # ==================================================================
        location ~ ^/api/v1/announcements(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v3.4 問題回報 API（user 端送單與看自己的歷史）
        #     POST /api/v1/reports、GET /api/v1/reports/mine
        #
        # ZH: 🔴 漏掛這條的症狀不是 404，是 **405** ——
        #     請求會落到下面的 catch-all（Open WebUI），而它對這個
        #     路徑不吃 POST。回應的 Server 標頭還是 nginx，很容易誤判
        #     成「後端壞了」。分辨方法：直連 :8002 再打一次 ——
        #     直連回 401（server: uvicorn）而經 nginx 回 405，就是路由漏掛。
        #
        # ZH: ⚠ 同一類已經發生過兩次（上一次是 /api/v1/models 回 502）。
        #     **main.py 每新增一個 include_router 的前綴，就要回來這裡補一條**
        #     （admin 與 worker 是例外：前者不對使用者埠開放，
        #       後者由 worker 直連 :8002）。
        # EN: v3.4 issue reports. A missing location here yields 405, not 404,
        #     because the request falls through to the Open WebUI catch-all.
        # ==================================================================
        location ~ ^/api/v1/reports(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v3.8 前台唯讀營運設定（GET /api/v1/system/public-settings）
        #     使用量頁的「額度重置日」、訓練頁的「任務逾時」、
        #     實驗室頁的「封存天數」都靠這一條。漏掛的症狀同上：405 不是 404。
        # EN: v3.8 whitelisted read-only operational settings for user pages.
        # ==================================================================
        location ~ ^/api/v1/system(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v2.0 code-server per-user 路由 (auth_request 驗證 JWT)
        # EN: v2.0 code-server per-user routing (auth_request validates JWT)
        # ==================================================================
        # ZH: 路徑 /code/{user_id}/ → 容器 cs-{user_id}:8080
        # ZH: 使用 regex 擷取 user_id 並驗證該 JWT 屬於此 user
        location ~* ^/code/([a-zA-Z0-9_-]+)(/.*)?$ {
            auth_request /_lab_authz;
            auth_request_set $auth_user $upstream_http_x_lab_user;

            # ZH: 內部 Docker DNS 解析 cs-<user_id> 容器
            # EN: Internal Docker DNS resolves cs-<user_id>
            # v2.1: 去掉 /code/<uid> 前綴後 proxy，否則 code-server 回 "Not found."
            set $upstream_codeserver "cs-$1";
            set $upstream_path $2;
            if ($upstream_path = "") { set $upstream_path "/"; }
            proxy_pass http://$upstream_codeserver:8080$upstream_path$is_args$args;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支援（code-server 用 WebSocket 通訊）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 長連線：code-server 持續開啟
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # ZH: 內部 auth_request 端點 — 給 job-scheduler 驗證 JWT 與 user 對應
        # EN: Internal auth_request endpoint — validates JWT and user ownership
        location = /_lab_authz {
            internal;
            proxy_pass $scheduler/api/v1/lab/_authz;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            # v2.1: 顯式轉發 Cookie 與 Authorization header
            # 瀏覽器直接 navigate /code/ 不會帶 Bearer header，靠 ai_hud_token cookie 認證
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # ==================================================================
        # ZH: Job Scheduler 健康檢查 | EN: Job Scheduler health check
        # ==================================================================
        location /api/health {
            proxy_pass $scheduler/health;
            proxy_set_header Host $host;
        }

        # ==================================================================
        # ZH: 訓練平台獨立 Web UI (方案 C) 
        # EN: Independent Web UI for training (Plan C)
        # ==================================================================
        # ==================================================================
        # ZH: 舊路徑 → 新路徑。**一定要留著。**
        #
        # ZH: 改名之前發出去的網址是 /train/（deploy_check 就把它標為「使用者
        #     入口」）。沒有這幾條的話，舊書籤會落到下面的 catch-all，
        #     也就是 **Open WebUI** —— 回 200、看起來正常，但那是完全不同的
        #     產品。靜默送到錯的地方比直接 404 更難查。
        #
        # ZH: 用 302 不用 301：301 會被瀏覽器硬快取，之後版面若再調整就洗不掉。
        # ==================================================================
        location ^~ /train/ { return 302 /V0/; }
        location ^~ /v1.5/  { return 302 /V0.5/; }
        location ^~ /v2/    { return 302 /V1/; }

        location ^~ /V0/ {
            alias /usr/share/nginx/html/V0/;
            index index.html;
            try_files $uri $uri/ /V0/index.html;
            # ZH: HTML 一律重新驗證（no-cache ≠ 不快取，是「用之前先問伺服器」）。
            #     為什麼一定要：?v= 的版號**寫在 index.html 裡面**，
            #     所以 index.html 一舊，拿到的就是舊版號 → 舊 JS/CSS，
            #     bump 版號完全失效。有 ETag 在，重新驗證多半只是 304，成本極低。
            add_header Cache-Control "no-cache" always;
        }

        # ==================================================================
        # ZH: UI V0.5（新舊對照用）。與 /V0/ **同一個後端、同一份資料**，
        #     差別只在前端檔案 —— 這樣看到的差異才確定是 UI 造成的。
        #     同源，所以 sessionStorage 的 token 共用，登入一次兩邊都能用。
        # ==================================================================
        location ^~ /V0.5/ {
            alias /usr/share/nginx/html/V0.5/;
            index index.html;
            try_files $uri $uri/ /V0.5/index.html;
            # ZH: HTML 一律重新驗證（no-cache ≠ 不快取，是「用之前先問伺服器」）。
            #     為什麼一定要：?v= 的版號**寫在 index.html 裡面**，
            #     所以 index.html 一舊，拿到的就是舊版號 → 舊 JS/CSS，
            #     bump 版號完全失效。有 ETag 在，重新驗證多半只是 304，成本極低。
            add_header Cache-Control "no-cache" always;
        }

        # ==================================================================
        # ZH: UI V1（現行版本，全新設計而非 V0.5 的延伸）。與其他版本共用同一個後端。
        #     設計推導見 docs/06-ui-V1-design.md。
        # ==================================================================
        location ^~ /V1/ {
            alias /usr/share/nginx/html/V1/;
            index index.html;
            try_files $uri $uri/ /V1/index.html;
            # ZH: HTML 一律重新驗證——?v= 版號寫在 index.html 裡，HTML 一舊版號就失效
            add_header Cache-Control "no-cache" always;
        }

        # ==================================================================
        # ZH: 根路徑 → 現行版本。學生只要記主機名就好。
        #
        # ZH: ⚠ 用 `location = /`（**精確比對**）而不是改掉下面的 catch-all。
        #     理由：Open WebUI 是個 SPA，它的資產與深層路徑仍然要落到下面那條；
        #     把 catch-all 換成導向的話，任何沒對到 location 的請求都會變成
        #     302 而不是 502 —— 那會讓「nginx 漏掛某個 /api/v1/ 前綴」這種問題
        #     更難查（文件裡就記過一次那樣的 502）。
        #
        # ZH: Open WebUI 在文件裡是「備用聊天」，本來就有自己的 :3000，
        #     所以它不需要 `/` 這個位置。
        # ==================================================================
        location = / {
            return 302 /V1/;
        }

        # ==================================================================
        # ZH: Open WebUI 主介面 (catch-all，延遲解析避免未啟動時崩潰)
        # EN: Open WebUI main interface (catch-all; lazy DNS so nginx starts without it)
        # ==================================================================
        location / {
            set $open_webui "http://open-webui:8080";
            proxy_pass $open_webui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ZH: WebSocket 支援 (Open WebUI 即時通訊)
            # EN: WebSocket support (Open WebUI real-time communication)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ==================================================================
        # ZH: Nginx 自身健康檢查端點 | EN: Nginx own health check endpoint
        # ==================================================================
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # ==================================================================
    # ZH: 管理員專屬獨立伺服器 (Port 8888)
    # EN: Dedicated Admin Server (Port 8888)
    # ==================================================================
    server {
        listen 8888;
        server_name _;

        # ZH: 同上 —— 管理端也必須用變數，否則 scheduler 重啟後管理介面全掛
        set $scheduler "http://job-scheduler:8000";

        # ==================================================================
        # ZH: 管理端 UI V1（現行版本）。規格見 docs/10-admin-ui-V1-design.md。
        #     舊版留在 `/`，這一版另開路徑 —— 管理端是出事時要用的東西，
        #     新版被信任之前舊版必須隨時可用（設計文件的鐵則 1）。
        # ==================================================================
        # ZH: 舊路徑 → 新路徑（與 port 80 同一個理由）。
        location ^~ /v1.5/ { return 302 /V0.5/; }
        location ^~ /v2/   { return 302 /V1/; }

        location ^~ /V1/ {
            alias /usr/share/nginx/html/admin-ui-V1/;
            index index.html;
            try_files $uri $uri/ /V1/index.html;
            # ZH: HTML 一律重新驗證——?v= 版號寫在 HTML 裡，HTML 一舊版號就失效。
            #     這個坑踩過（見 static-asset-cache-busting）。
            add_header Cache-Control "no-cache" always;
        }

        # ZH: 管理端 UI V0.5（新舊對照用）。必須放在 location / 之前才會命中。
        location ^~ /V0.5/ {
            alias /usr/share/nginx/html/admin-ui-V0.5/;
            index index.html;
            try_files $uri $uri/ /V0.5/index.html;
            # ZH: HTML 一律重新驗證（no-cache ≠ 不快取，是「用之前先問伺服器」）。
            #     為什麼一定要：?v= 的版號**寫在 index.html 裡面**，
            #     所以 index.html 一舊，拿到的就是舊版號 → 舊 JS/CSS，
            #     bump 版號完全失效。有 ETag 在，重新驗證多半只是 304，成本極低。
            add_header Cache-Control "no-cache" always;
        }

        # 靜態管理員前端介面 (admin-ui)
        # ZH: 根路徑 → 現行版本（與 port 80 同一個道理）。
        #     舊版仍在 /V0/，catch-all 留給它，所以直接開 /xxx.html 仍是舊版。
        location = / {
            return 302 /V1/;
        }

        location / {
            alias /usr/share/nginx/html/admin-ui-V0/;
            index index.html;
            try_files $uri $uri/ /index.html;
            # ZH: HTML 一律重新驗證（no-cache ≠ 不快取，是「用之前先問伺服器」）。
            #     為什麼一定要：?v= 的版號**寫在 index.html 裡面**，
            #     所以 index.html 一舊，拿到的就是舊版號 → 舊 JS/CSS，
            #     bump 版號完全失效。有 ETag 在，重新驗證多半只是 304，成本極低。
            add_header Cache-Control "no-cache" always;
        }

        # 允許存取認證 API (供管理員登入)
        location ~ ^/api/v1/auth(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理員專屬 API
        location ~ ^/api/v1/admin(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZH: v2.5 外部 AI 分流管理（對應表 + 網址設定，admin-ui 用）
        # EN: v2.5 External AI routing admin (mapping + URL setting, used by admin-ui)
        location ~ ^/api/v1/external-ai(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
