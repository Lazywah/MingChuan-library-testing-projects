# ==============================================================================
# ZH: AI 訓練平台 - Nginx 反向代理設定
# EN: AI Training Platform - Nginx Reverse Proxy Configuration
# ZH: 用途：統一入口、路由分發、WebSocket 支援、健康檢查
# EN: Purpose: Single entry point, routing, WebSocket support, health check
#
# ZH: 路由規則：
# EN: Routing rules:
#   /                    → Open WebUI (:8080)  ZH: 聊天介面 | EN: Chat UI
#   /api/v1/auth/*       → Job Scheduler (:8000) ZH: 認證 API | EN: Auth API
#   /api/v1/jobs/*       → Job Scheduler (:8000) ZH: 任務 API | EN: Jobs API
#   /health              → 200 OK               ZH: 健康檢查 | EN: Health check
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ZH: 請求體大小限制 (支援大型資料集上傳) | EN: Request body size limit
    client_max_body_size 10G;

    # ==================================================================
    # ZH: 上游服務定義 | EN: Upstream service definitions
    #
    # ZH: 🔴 **刻意不用 `upstream {}` 區塊。**
    #     nginx 對 `upstream` 裡的主機名**只在啟動時解析一次**。
    #     job-scheduler 容器一旦重啟就會拿到新 IP，而 nginx 還在打舊的 ——
    #     結果是**整個 API 全部 502**，直到 nginx 也重啟為止。
    #
    # ZH: 這不是理論問題：`docs/00` 教維運人員用
    #         docker compose up -d job-scheduler
    #     重載設定，照做就會把整個平台打掛。
    #     2026-08-27 稽核實測重現：nginx 打 172.21.0.3、容器實際在 172.21.0.2，
    #     錯誤訊息是 `connect() failed (111: Connection refused)`。
    #
    # ZH: 改法：把位址放進**變數**，nginx 就會在每次請求時經由下面的
    #     `resolver`（Docker 內部 DNS）重新解析。這與 open-webui 用的是
    #     同一套做法（Open WebUI 的 catch-all 原本也是這樣寫,2026-08-28 已移除）。
    #
    # ZH: ⚠ 用變數之後 nginx **不會**自動接上原始 URI，
    #     所以每個 proxy_pass 都必須自己接 `$request_uri`（原本就是這樣寫的）。
    # EN: Deliberately NOT an `upstream {}` block — nginx resolves those once at
    #     startup, so a container restart yields platform-wide 502s.
    # ==================================================================

    # ZH: Docker 內部 DNS，讓 open-webui 可在未啟動時延遲解析，避免 nginx 啟動失敗
    # EN: Docker internal DNS so open-webui resolves lazily even if not running
    resolver 127.0.0.11 valid=10s;

    # ==================================================================
    # ZH: 🔀 :80 —— 純轉址（2026-09-01 全面切 https，擁有者裁定）。
    #     只做兩件事，**沒有任何應用路由**：
    #       1. /.well-known/ 直出（LE 續期驗證）——🔴 刻意**不**跟著轉 https：
    #          若哪天憑證過期、https 端掛掉，續期驗證仍有一條不依賴
    #          憑證健康的路，否則「過期 → 驗證被轉去掛掉的 https →
    #          續不了 → 永遠掛」是個死結。
    #       2. 其餘一律 301 → https（舊網址舊書籤全部自動升級）。
    # ZH: ⚠ 若有非瀏覽器的整合要打 API，請直接用 https —— 301 轉址時
    #     部分工具會把 POST 變 GET，行為會默默走樣。
    # EN: Port 80 = redirect-only + ACME passthrough (deliberately not
    #     redirected, to avoid the expired-cert renewal deadlock).
    # ==================================================================
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/ {
            alias /usr/share/nginx/html/.well-known/;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # ==================================================================
        # ZH: 🔒 443 —— 使用者端的**唯一**應用面（2026-09-01 起；80 只剩轉址）。
        #     check_nginx_routes 的守門對象也改成這個 block。
        # ==================================================================
        listen 443 ssl;   # ZH: 2026-09-01 啟用（Let's Encrypt）
        # ZH: 直接讀 certbot 的 letsencrypt-data volume（live/ 內是符號連結，
        #     永遠指向最新一版）——續期後**不需要搬檔**，nginx 的 6h reload
        #     迴圈（見 docker-compose 的 command）會自動撿起新憑證。
        # ZH: 日後改用 IT 簽的一年期憑證：檔案放 infrastructure/certs/、
        #     把這兩行改回 /etc/nginx/certs/ 路徑、reload 即可（掛載都還在）。
        ssl_certificate     /etc/letsencrypt/live/ai.lib.mcu.edu.tw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai.lib.mcu.edu.tw/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name _;

        # ZH: 後端位址放變數 → 每次請求重新解析（理由見上方註解）
        set $scheduler "http://job-scheduler:8000";

        # ==================================================================
        # ZH: 認證 API 路由 | EN: Auth API routing
        # v2.1 修正：regex 同時匹配 /api/v1/auth 與 /api/v1/auth/ (含子路徑)
        # 配合 FastAPI redirect_slashes=False，避免有/無斜線兩端互打 307
        # ==================================================================
        location ~ ^/api/v1/auth(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # SSO API 路由
        # ==================================================================
        location ~ ^/api/v1/sso(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: 資料集 API 路由 | EN: Datasets API routing
        # ==================================================================
        location ~ ^/api/v1/datasets(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v2.4 動態模型清單（各 AI 工具下拉依 tool_type 抓取）
        # EN: v2.4 dynamic model list (per-tool dropdowns)
        # ==================================================================
        location ~ ^/api/v1/models(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZH: v2.5 外部 AI 分流（使用者 /me 導流；admin 對應表走 /external-ai/admin/*）
        # EN: v2.5 External AI routing (user /me; admin mapping under /external-ai/admin/*)
        location ~ ^/api/v1/external-ai(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZH: v2.6 RAG 客服/導覽助手（/ask 為 SSE 串流，須關 buffering；公開免登入）
        # EN: v2.6 RAG support/guide assistant (/ask is SSE; buffering off; public)
        location ~ ^/api/v1/assistant(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # ==================================================================
        # ZH: 任務 SSE 串流（M1 修復：必須關閉 buffering 以免延遲）
        # EN: Job SSE stream (M1 fix: disable buffering to avoid latency)
        # ZH: 正則優先匹配 /api/v1/jobs/{uuid}/stream
        # EN: Regex matches /api/v1/jobs/{uuid}/stream first
        # ==================================================================
        location ~* ^/api/v1/jobs/[^/]+/stream$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;        # ZH: SSE 長連線 | EN: Long-lived SSE
        }

        # ==================================================================
        # ZH: 任務排程 API 路由 | EN: Job Scheduler API routing
        # v2.1 修正：regex 匹配有/無斜線，且 /jobs/{id}/stream 的 SSE location
        # (前面 ~* ^/api/v1/jobs/[^/]+/stream$) 仍會優先匹配 (regex 依檔案順序)
        # ==================================================================
        location ~ ^/api/v1/jobs(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: AI 助手 API 路由 (串流代理) | EN: AI Assistant API routing
        # ==================================================================
        location ~ ^/api/v1/chat(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ZH: 支援串流輸出 (SSE) | EN: Support streaming output
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # ==================================================================
        # ZH: Notebook 路由已於 Phase E 移除（v1 偽 Notebook 由 v2.0 Lab 取代）
        # EN: Notebook routes removed in Phase E (v1 superseded by v2.0 Lab)
        # ==================================================================

        # ==================================================================
        # ZH: v2.0 Lab 模組 — Session 管理、Secrets、配額 API
        # EN: v2.0 Lab module — session/secrets/quota API
        # ==================================================================
        location ~ ^/api/v1/lab(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/secrets(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v2.2 公告 API（user 端讀首頁公告） | EN: v2.2 announcements (user homepage)
        # ==================================================================
        location ~ ^/api/v1/announcements(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v3.4 問題回報 API（user 端送單與看自己的歷史）
        #     POST /api/v1/reports、GET /api/v1/reports/mine
        #
        # ZH: 🔴 漏掛這條的症狀不是 404，是 **405** ——
        #     請求會落到下面的 catch-all（Open WebUI），而它對這個
        #     路徑不吃 POST。回應的 Server 標頭還是 nginx，很容易誤判
        #     成「後端壞了」。分辨方法：直連 :8002 再打一次 ——
        #     直連回 401（server: uvicorn）而經 nginx 回 405，就是路由漏掛。
        #
        # ZH: ⚠ 同一類已經發生過兩次（上一次是 /api/v1/models 回 502）。
        #     **main.py 每新增一個 include_router 的前綴，就要回來這裡補一條**
        #     （admin 與 worker 是例外：前者不對使用者埠開放，
        #       後者由 worker 直連 :8002）。
        # EN: v3.4 issue reports. A missing location here yields 405, not 404,
        #     because the request falls through to the Open WebUI catch-all.
        # ==================================================================
        location ~ ^/api/v1/reports(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v3.8 前台唯讀營運設定（GET /api/v1/system/public-settings）
        #     使用量頁的「額度重置日」、訓練頁的「任務逾時」、
        #     實驗室頁的「封存天數」都靠這一條。漏掛的症狀同上：405 不是 404。
        # EN: v3.8 whitelisted read-only operational settings for user pages.
        # ==================================================================
        location ~ ^/api/v1/system(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================================================
        # ZH: v2.0 code-server per-user 路由 (auth_request 驗證 JWT)
        # EN: v2.0 code-server per-user routing (auth_request validates JWT)
        # ==================================================================
        # ZH: 路徑 /code/{user_id}/ → 容器 cs-{user_id}:8080
        # ZH: 使用 regex 擷取 user_id 並驗證該 JWT 屬於此 user
        location ~* ^/code/([a-zA-Z0-9_-]+)(/.*)?$ {
            auth_request /_lab_authz;
            auth_request_set $auth_user $upstream_http_x_lab_user;

            # ZH: 內部 Docker DNS 解析 cs-<user_id> 容器
            # EN: Internal Docker DNS resolves cs-<user_id>
            # v2.1: 去掉 /code/<uid> 前綴後 proxy，否則 code-server 回 "Not found."
            set $upstream_codeserver "cs-$1";
            set $upstream_path $2;
            if ($upstream_path = "") { set $upstream_path "/"; }
            proxy_pass http://$upstream_codeserver:8080$upstream_path$is_args$args;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支援（code-server 用 WebSocket 通訊）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 長連線：code-server 持續開啟
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # ZH: 內部 auth_request 端點 — 給 job-scheduler 驗證 JWT 與 user 對應
        # EN: Internal auth_request endpoint — validates JWT and user ownership
        location = /_lab_authz {
            internal;
            proxy_pass $scheduler/api/v1/lab/_authz;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            # v2.1: 顯式轉發 Cookie 與 Authorization header
            # 瀏覽器直接 navigate /code/ 不會帶 Bearer header，靠 ai_hud_token cookie 認證
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # ==================================================================
        # ZH: Job Scheduler 健康檢查 | EN: Job Scheduler health check
        # ==================================================================
        location /api/health {
            proxy_pass $scheduler/health;
            proxy_set_header Host $host;
        }

        # ==================================================================
        # ZH: 訓練平台獨立 Web UI (方案 C) 
        # EN: Independent Web UI for training (Plan C)
        # ==================================================================
        # ==================================================================
        # ZH: 舊路徑 → 新路徑。**一定要留著。**
        #
        # ZH: 改名之前發出去的網址是 /train/（deploy_check 就把它標為「使用者
        #     入口」）。沒有這幾條的話，舊書籤會落到下面的 catch-all，
        #     也就是 **Open WebUI** —— 回 200、看起來正常，但那是完全不同的
        #     產品。靜默送到錯的地方比直接 404 更難查。
        #
        # ZH: 用 302 不用 301：301 會被瀏覽器硬快取，之後版面若再調整就洗不掉。
        # ==================================================================
        # ==================================================================
        # ZH: 🔒 v4.0（擁有者裁定 2026-09-01）：正式上線只開 V1。
        #     舊版 V0 / V0.5 從對外埠**整個搬走**，改到只綁本機的 :8890
        #     （見本檔最下方的 server 區塊）——對照舊版時在伺服器上開
        #     `http://localhost:8890/V0/`。
        #
        # ZH: 為什麼不用 nginx 的 allow/deny 擋來源：Docker Desktop 的埠轉發
        #     會把**所有**連線的來源改寫成閘道 IP（實測 48 小時 log 3566 筆
        #     全是 172.18.0.1）—— nginx 根本分不出本機與校內。
        #     只綁 127.0.0.1 的 host port 是在 nginx 之前就擋掉，與 :8888 同機制。
        #
        # ZH: 這裡留 302 → /V1/ 而不是直接拿掉：改名前發出去的網址（/train/）
        #     與舊書籤不該落到 404 或 Open WebUI。302 不用 301——301 會被硬快取。
        # ==================================================================
        # ==================================================================
        # ZH: 🔐 SSL 憑證申請的 HTTP 驗證路徑（2026-09-01 加）。
        #     CA 會來抓 http://ai.lib.mcu.edu.tw/.well-known/<指定檔>，
        #     檔案放主機的 infrastructure/webroot/.well-known/ 即可（compose 掛入）。
        #     平常這個資料夾是空的（一個 README），留著無害；
        #     Let's Encrypt 的 acme-challenge 也走同一條。
        # ==================================================================
        location ^~ /.well-known/ {
            alias /usr/share/nginx/html/.well-known/;
            default_type text/plain;   # ZH: 驗證檔多半無副檔名，明給 MIME 免得被當 octet-stream
        }

        location ^~ /train/ { return 302 /V1/; }
        location ^~ /v1.5/  { return 302 /V1/; }
        location ^~ /v2/    { return 302 /V1/; }
        location ^~ /V0/    { return 302 /V1/; }
        location ^~ /V0.5/  { return 302 /V1/; }

        # ==================================================================
        # ZH: UI V1（現行版本，全新設計而非 V0.5 的延伸）。與其他版本共用同一個後端。
        #     設計推導見 docs/06-ui-V1-design.md。
        # ==================================================================
        location ^~ /V1/ {
            alias /usr/share/nginx/html/V1/;
            index index.html;
            try_files $uri $uri/ /V1/index.html;
            # ZH: HTML 一律重新驗證——?v= 版號寫在 index.html 裡，HTML 一舊版號就失效
            add_header Cache-Control "no-cache" always;
        }

        # ==================================================================
        # ZH: 根路徑 → 現行版本。學生只要記主機名就好。
        #
        # ZH: ⚠ 用 `location = /`（**精確比對**），不要改成前綴比對 ——
        #     那會把所有未匹配的路徑一起吃掉。
        #
        # ZH: 2026-08-28 更新：這裡原本還有一段理由，說「不能把 catch-all 換成導向，
        #     否則漏掛 /api/v1/ 前綴會變成 302 而不是 502，更難查」。
        #     那個顧慮**已經由下面的 `location /api/` 兜底處理掉了**
        #     （漏掛的 API 路徑現在回 404 + JSON，比 502 更清楚）。
        # ==================================================================
        location = / {
            return 302 /V1/;
        }

        # ==================================================================
        # ZH: Open WebUI 主介面 (catch-all，延遲解析避免未啟動時崩潰)
        # EN: Open WebUI main interface (catch-all; lazy DNS so nginx starts without it)
        # ==================================================================
        # ==================================================================
        # ZH: 🔴 API 路徑的兜底 —— **不可以落到下面的 catch-all**。
        #
        # ZH: 沒有這一條的話，任何沒被上面某條 location 接住的 `/api/...`
        #     會被轉去 Open WebUI，而它會回自己的 SPA 首頁 ——
        #     **200，而且可快取**。後果有兩個，都很難查：
        #       1. 呼叫端分不出「這個 API 不存在／不對外開放」與「這是一頁 HTML」。
        #          例如學生在 :80 打 `/api/v1/admin/announcements`（管理端刻意
        #          不對使用者埠開放）拿到的是 200 + HTML，不是 404。
        #       2. 🔴 **瀏覽器會把那份 HTML 存起來**。之後就算 location 補好了，
        #          瀏覽器仍然繼續給舊的 HTML，前端 JSON.parse 失敗 →
        #          畫面顯示「暫時讀不到」而後端完全正常。
        #          2026-08-27 稽核時問題回報頁就是這樣壞著的。
        #
        # ZH: prefix location 的優先度低於上面所有 regex location，
        #     所以這條只會接住「沒有人要的」/api/ 請求，不會擋到正常路由。
        # EN: Fallback for /api/ paths — must NOT fall through to the Open WebUI
        #     catch-all, which answers with a cacheable 200 HTML page.
        # ==================================================================
        location /api/ {
            add_header Cache-Control "no-store" always;
            # ZH: 回 JSON 而不是 nginx 的 HTML 錯誤頁 —— 呼叫端是程式不是人，
            #     而且 HTML 正是上面那段註解在講的問題。格式與 FastAPI 的 404 一致。
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }

        # ==================================================================
        # ZH: 兜底 —— 沒對到任何 location 的路徑。
        #
        # ZH: 🔴 2026-08-28：這裡原本 proxy 到 **Open WebUI**（擁有者裁定拿掉）。
        #     那樣做有三個實際後果：
        #       1. Open WebUI 沒啟動時，**任何打錯的網址都回 502 Bad Gateway** ——
        #          使用者看起來像整個平台掛了。
        #       2. 它會回自己的 SPA 首頁，**200 而且可快取**。瀏覽器把那份 HTML
        #          存起來之後，就算 nginx 之後補好了 location，前端仍然拿到舊 HTML
        #          → JSON.parse 失敗 → 畫面顯示「讀不到」而後端完全正常。
        #          （2026-08-27 稽核時問題回報頁就是這樣壞著的。）
        #       3. 它讓「nginx 漏掛某個前綴」的症狀變成 502 或 200-HTML，
        #          兩種都不像「這個路徑不存在」。
        #
        # ZH: 查證後拿掉的依據：Open WebUI 在文件裡是「**備用聊天**、選用」，
        #     有自己的 `:3000`，**平台三個版本的 UI 都沒有任何連結指向它**，
        #     而且它的資料庫 user/chat/message **全部 0 筆**、最後修改是 2026-05-07。
        #     它從來沒有人用過，卻擁有整個 :80 未匹配路徑的所有權。
        #
        # ZH: 現在改成誠實的 404。給一句雙語說明與回首頁的連結 ——
        #     狀態碼要對（給程式看），文案要有用（給人看）。
        # EN: Was proxied to Open WebUI (unused, 0 chats, no links to it). Now an
        #     honest 404 so a typo'd URL is not a 502 and cannot poison the cache.
        # ==================================================================
        location / {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            return 404 '<!doctype html><meta charset="utf-8"><title>404</title><body style="font-family:system-ui;padding:3rem;max-width:34rem;margin:auto"><h1>找不到這個頁面</h1><p>Page not found.</p><p><a href="/V1/">回到 MCU AI Base</a> / <a href="/V1/">Back to MCU AI Base</a></p></body>';
        }

        # ==================================================================
        # ZH: Nginx 自身健康檢查端點 | EN: Nginx own health check endpoint
        # ==================================================================
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # ==================================================================
    # ZH: 管理員專屬獨立伺服器 (Port 8888)
    # EN: Dedicated Admin Server (Port 8888)
    # ==================================================================
    server {
        # ==================================================================
        # ZH: 🔐 2026-09-01 管理端對校內開放（擁有者裁定——這台少有人到場，
        #     接管者需從別台電腦管理）。三道防線缺一不可：
        #       1. **TLS 強制**：listen 8888 ssl（同一張 LE 憑證；憑證不綁埠）。
        #          管理員帳密絕不明文走內網——這是開放的前提不是選配。
        #       2. **防火牆限校內**：Windows 規則「AI Base admin (campus only)」
        #          限 120.125.0.0/16＋私網段。真界線在這裡——nginx 層看不到
        #          真實來源 IP（Docker 埠轉發洗成閘道 IP，實測），擋不了。
        #       3. 帳密 + 每次登入寄通知信（既有機制）。
        # ZH: 入口一律 https://ai.lib.mcu.edu.tw:8888/（本機也是）；
        #     舊的 http://localhost:8888 已失效——單一入口，好教好記。
        # EN: Admin surface opened to campus (owner decision 2026-09-01):
        #     TLS-only + Windows-firewall campus scoping + per-login email alert.
        # ==================================================================
        listen 8888 ssl;
        ssl_certificate     /etc/letsencrypt/live/ai.lib.mcu.edu.tw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai.lib.mcu.edu.tw/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name _;

        # ZH: 同上 —— 管理端也必須用變數，否則 scheduler 重啟後管理介面全掛
        set $scheduler "http://job-scheduler:8000";

        # ==================================================================
        # ZH: 管理端 UI V1（現行版本）。規格見 docs/10-admin-ui-V1-design.md。
        #     舊版留在 `/`，這一版另開路徑 —— 管理端是出事時要用的東西，
        #     新版被信任之前舊版必須隨時可用（設計文件的鐵則 1）。
        # ==================================================================
        # ZH: 舊路徑 → 新路徑（與 port 80 同一個理由）。
        location ^~ /v1.5/ { return 302 /V0.5/; }
        location ^~ /v2/   { return 302 /V1/; }

        location ^~ /V1/ {
            alias /usr/share/nginx/html/admin-ui-V1/;
            index index.html;
            try_files $uri $uri/ /V1/index.html;
            # ZH: HTML 一律重新驗證——?v= 版號寫在 HTML 裡，HTML 一舊版號就失效。
            #     這個坑踩過（見 static-asset-cache-busting）。
            add_header Cache-Control "no-cache" always;
        }

        # ZH: 管理端 UI V0.5（新舊對照用）。必須放在 location / 之前才會命中。
        location ^~ /V0.5/ {
            alias /usr/share/nginx/html/admin-ui-V0.5/;
            index index.html;
            try_files $uri $uri/ /V0.5/index.html;
            # ZH: HTML 一律重新驗證（no-cache ≠ 不快取，是「用之前先問伺服器」）。
            #     為什麼一定要：?v= 的版號**寫在 index.html 裡面**，
            #     所以 index.html 一舊，拿到的就是舊版號 → 舊 JS/CSS，
            #     bump 版號完全失效。有 ETag 在，重新驗證多半只是 304，成本極低。
            add_header Cache-Control "no-cache" always;
        }

        # 靜態管理員前端介面 (admin-ui)
        # ZH: 根路徑 → 現行版本（與 port 80 同一個道理）。
        #     舊版仍在 /V0/，catch-all 留給它，所以直接開 /xxx.html 仍是舊版。
        location = / {
            return 302 /V1/;
        }

        location / {
            alias /usr/share/nginx/html/admin-ui-V0/;
            index index.html;
            try_files $uri $uri/ /index.html;
            # ZH: HTML 一律重新驗證（no-cache ≠ 不快取，是「用之前先問伺服器」）。
            #     為什麼一定要：?v= 的版號**寫在 index.html 裡面**，
            #     所以 index.html 一舊，拿到的就是舊版號 → 舊 JS/CSS，
            #     bump 版號完全失效。有 ETag 在，重新驗證多半只是 304，成本極低。
            add_header Cache-Control "no-cache" always;
        }

        # 允許存取認證 API (供管理員登入)
        location ~ ^/api/v1/auth(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ZH: 🔴 v3.8 告訴後端「這個請求來自管理端」。
            #     用途：兩端的登入 cookie 名稱要分開（見 app/auth.py::cookie_name_for）。
            #     cookie 規格**不分 port**,共用一個名稱時後登入的會覆蓋先登入的 ——
            #     在使用者端登入會讓管理端的 cookie 身分跟著變（2026-08-27 稽核實測）。
            # ZH: ⚠ 不能改用 Host 判斷：nginx 傳的 `$host` **不含 port**,
            #     兩個 server 區塊在後端看起來一模一樣。
            proxy_set_header X-AIBase-Surface admin;
        }

        # 管理員專屬 API
        location ~ ^/api/v1/admin(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ZH: 🔴 v3.8 告訴後端「這個請求來自管理端」。
            #     用途：兩端的登入 cookie 名稱要分開（見 app/auth.py::cookie_name_for）。
            #     cookie 規格**不分 port**,共用一個名稱時後登入的會覆蓋先登入的 ——
            #     在使用者端登入會讓管理端的 cookie 身分跟著變（2026-08-27 稽核實測）。
            # ZH: ⚠ 不能改用 Host 判斷：nginx 傳的 `$host` **不含 port**,
            #     兩個 server 區塊在後端看起來一模一樣。
            proxy_set_header X-AIBase-Surface admin;
        }

        # ZH: v2.5 外部 AI 分流管理（對應表 + 網址設定，admin-ui 用）
        # EN: v2.5 External AI routing admin (mapping + URL setting, used by admin-ui)
        location ~ ^/api/v1/external-ai(/.*)?$ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ZH: 🔴 v3.8 告訴後端「這個請求來自管理端」。
            #     用途：兩端的登入 cookie 名稱要分開（見 app/auth.py::cookie_name_for）。
            #     cookie 規格**不分 port**,共用一個名稱時後登入的會覆蓋先登入的 ——
            #     在使用者端登入會讓管理端的 cookie 身分跟著變（2026-08-27 稽核實測）。
            # ZH: ⚠ 不能改用 Host 判斷：nginx 傳的 `$host` **不含 port**,
            #     兩個 server 區塊在後端看起來一模一樣。
            proxy_set_header X-AIBase-Surface admin;
        }

    }

    # ==================================================================
    # ZH: 🔒 :8890 —— 舊版使用者端 UI（V0 / V0.5），**只給本機**。
    #     v4.0（擁有者裁定 2026-09-01）：正式上線對外只開 V1，
    #     舊版留著做新舊對照，從 :80 搬到這裡。
    #
    # ZH: 「只給本機」由 docker-compose 的 `127.0.0.1:8890:8890` 綁定保證
    #     （與 :8888 管理端同一機制，實測外部連線在 host 層就被拒）。
    #     nginx 這裡**不做**來源限制——Docker 埠轉發會洗掉來源 IP，做了也是假的。
    #
    # ZH: API 用一條通用代理，不像 :80 逐前綴列舉——那套列舉是對外埠的
    #     紀律（配 check_nginx_routes 守門）；這個埠只有本機管理者用，
    #     舊版要打的前綴（auth/sso/lab/secrets/assistant/jobs/chat…）全放行即可。
    # ==================================================================
    server {
        listen 8890;
        server_name _;

        set $scheduler "http://job-scheduler:8000";

        location ^~ /V0/ {
            alias /usr/share/nginx/html/V0/;
            index index.html;
            try_files $uri $uri/ /V0/index.html;
            add_header Cache-Control "no-cache" always;   # ZH: ?v= 寫在 HTML 裡，HTML 一舊版號就失效
        }

        # ZH: v4.1 —— V1 也掛在本機埠（2026-09-01）。https 全轉之後 :80 只剩轉址、
        #     https://localhost 又必吃憑證名稱警告（憑證簽給網域），
        #     這裡是**唯一**能在本機用明文測 V1 的門。僅 127.0.0.1，不影響對外。
        location ^~ /V1/ {
            alias /usr/share/nginx/html/V1/;
            index index.html;
            try_files $uri $uri/ /V1/index.html;
            add_header Cache-Control "no-cache" always;
        }

        location ^~ /V0.5/ {
            alias /usr/share/nginx/html/V0.5/;
            index index.html;
            try_files $uri $uri/ /V0.5/index.html;
            add_header Cache-Control "no-cache" always;
        }

        # ZH: v4.2 —— 管理端 V1 也掛本機埠（2026-09-02）。理由同 /V1/：
        #     :8888 只有 https 而憑證簽給網域，本機測試工具打 localhost
        #     必吃憑證警告，這裡是唯一能明文測管理端的門。僅 127.0.0.1。
        #     ⚠ 這裡**不送** X-AIBase-Surface: admin —— 那個標頭只決定
        #       cookie 命名（auth.py 的 cookie_name_for），管理端 UI 走
        #       Bearer 不受影響；反而送了會讓這個本機門寫 admin cookie，
        #       與正式 :8888 的行為差一截。
        location ^~ /admin/ {
            alias /usr/share/nginx/html/admin-ui-V1/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache" always;
        }

        location = / {
            return 302 /V0/;
        }

        # ZH: SSE（chat / assistant）也會經過這裡 → 關 buffering、拉長 read timeout
        location /api/ {
            proxy_pass $scheduler$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 24h;
        }
    }
}
