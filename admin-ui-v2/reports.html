<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_reports">回報 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=dd946cc2">
    <link rel="stylesheet" href="styles.css?v=e917e7df">
    <link rel="stylesheet" href="admin.css?v=d774186f">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <div class="adm-sec__head">
        <h1 class="hero__title" data-i18n="adm_nav_reports">回報</h1>
    </div>

    <!-- ZH: 這一頁的三段都是為了同一件事：**有人問了問題，你要回答他**。
             寄信紀錄與稽核單獨看沒什麼意思，是回答問題時才有用 ——
             舊版把它們放在別的地方，於是回答一個問題要跳三個分頁。 -->

    <section class="adm-sec" aria-labelledby="h-reports">
        <div class="adm-sec__head"><h2 id="h-reports" data-i18n="adm_nav_reports">回報</h2></div>
        <!-- ZH: 每個篩選都帶數量 —— 不帶的話你得逐一點過才知道哪裡有事。 -->
        <div class="adm-inline" id="filters"></div>
        <div id="list" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-mail">
        <div class="adm-sec__head"><h2 id="h-mail" data-i18n="rp_mail">寄信紀錄</h2></div>
        <div id="mail" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-audit">
        <div class="adm-sec__head"><h2 id="h-audit" data-i18n="rp_audit">管理動作紀錄</h2></div>
        <div id="audit" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

</main>

<script src="tz.js?v=3608fea5"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=adcdce5a"></script>
<script src="i18n-admin.js?v=09cded16"></script>
<script src="prefs.js?v=8b7b4277"></script>
<script src="admin-chrome.js?v=3c57b044"></script>
<script src="reports.js?v=b339d37a"></script>
</body>
</html>
