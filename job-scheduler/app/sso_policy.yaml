# ==============================================================================
# SSO Policy 設定 | SSO Policy Configuration
# ==============================================================================
# ZH: provider 欄位決定載入哪個 SSO client（v2.1 新增）：
#   mock — MockSSOClient (開發測試用，從本檔 mock.users 讀帳號)
#   cas  — CASSSOClient (Yale CAS 協定，學校用 CAS server 時用)
#   oidc — OIDCSSOClient (OIDC 協定，MCU 用 Microsoft Entra ID 走這條)
#
# EN: `provider` decides which SSO client to load (v2.1):
#   mock | cas | oidc
#
# ZH: mock_mode 保留為向後相容欄位（true 時強制走 mock，覆寫 provider）
# EN: mock_mode kept for backward compat (true forces mock, overrides provider)
# ==============================================================================

mock_mode: false           # v3.1：切換 OIDC 正式登入（false 才不會強制走 mock）
provider: oidc             # mock | cas | oidc

# ==============================================================================
# Mock SSO 測試帳號 — 僅 mock_mode=true 或 provider=mock 時生效
# ==============================================================================
mock:
  users:
    - student_id: "T1090001"
      password: "T1090001"
      name: "林小明"
      email: "T1090001@school.edu.tw"
      role: "student"
    - student_id: "T1090002"
      password: "T1090002"
      name: "陳靜水"
      email: "T1090002@school.edu.tw"
      role: "student"
    # C-6: ZH: 已移除 admin/admin 硬編碼憑證，管理員帳號請透過資料庫建立
    # EN: Hardcoded admin/admin removed — create admin accounts via DB provisioning instead

# ==============================================================================
# CAS SSO 設定（學術界主流協定；MCU 未使用，留作其他學校未來用）
# ==============================================================================
cas:
  server_url: "https://cas.school.edu.tw/cas"
  service_url: "http://localhost:8000/api/v1/sso/callback"

# ==============================================================================
# OIDC SSO 設定（v3.1 — MCU 自建 OIDC 伺服器 auth.mcu.edu.tw）
# ==============================================================================
# ZH: ⚠️ v3.1 重大更正（2026-08-01）：MCU 的 SSO 是「自建 OIDC」（auth.mcu.edu.tw），
#     **不是** Microsoft Entra ID。實測把請求送去 login.microsoftonline.com 會得到
#     AADSTS700016（app 不在該目錄）。端點一律由 discovery_url 啟動時自動抓取。
#     其 id_token 無身分欄位（claims 僅 sub/iss/auth_time/acr）→ 身分改由
#     access_token 打 userinfo_endpoint 取得（IT 規定）。
#
# 🔴 安全規定不變：client_id / client_secret 一律放 .env（已 gitignore），
#    **絕不要填進本檔**（本檔會進版控）。PENDING 佔位由 config.py 以環境變數
#    OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / OIDC_REDIRECT_URI（選用 OIDC_DISCOVERY_URL）覆寫。
#
# ZH: 若 client_id / client_secret 仍是 "PENDING"（且環境變數未設），工廠函式會自動 fallback
#     到 mock 並 warning，服務不會崩潰（v1.1 I7 失敗保險機制）
# ==============================================================================
oidc:
  discovery_url: "https://auth.mcu.edu.tw/.well-known/openid-configuration"   # MCU OIDC discovery（公開）
  client_id: "PENDING"          # 🔴 不要填這裡！改填 .env 的 OIDC_CLIENT_ID
  client_secret: "PENDING"      # 🔴 不要填這裡！改填 .env 的 OIDC_CLIENT_SECRET（機敏，本檔進版控）
  redirect_uri: "http://localhost/api/v1/sso/oidc/callback"   # dev 佔位（走 nginx :80）。正式值由 .env 的 OIDC_REDIRECT_URI 覆寫，須與 IdP 註冊逐字一致
  scopes:
    - "openid"
    - "email"
    - "profile"
  # ZH: userinfo 回傳中「學號/員編」的欄位名。2026-08-01 實測：MCU userinfo 只回
  #     {'sub': '<學號>'} 一個欄位 → 釘死用 sub（若 IT 日後改版再調整）。
  username_claim: "sub"
  # ZH: userinfo 無 email → 以「學號@此網域」補（學生信箱 = <學號>@me.mcu.edu.tw，
  #     與 MYAI 綁定的 email 一致）。留空則 fallback 為 @unknown。
  email_domain: "me.mcu.edu.tw"
  # ZH: MCU 自建 IdP 的密碼變更/重設入口未知，留空（前端會顯示「密碼由學校統一管理」）
  password_change_url: ""
  password_reset_url:  ""
