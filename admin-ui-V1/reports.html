<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_msg">訊息 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=13de82fd">
    <link rel="stylesheet" href="admin.css?v=88fd6b2a">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <div class="adm-sec__head">
        <h1 class="hero__title" data-i18n="adm_nav_msg">訊息</h1>
    </div>

    <!-- ZH: 這一頁的三段都是為了同一件事：**有人問了問題，你要回答他**。
             寄信紀錄與稽核單獨看沒什麼意思，是回答問題時才有用 ——
             舊版把它們放在別的地方，於是回答一個問題要跳三個分頁。 -->

    <!-- ZH: 公告放在最前面。這一頁是「跟使用者之間的訊息」——
             公告是往外廣播、回報是往內收，往外的那半要先看到，
             因為它是你主動要做的事，不是等著被觸發的。 -->
    <section class="adm-sec" aria-labelledby="h-news">
        <div class="adm-sec__head">
            <h2>
                <span id="h-news" data-i18n="rp_news">公告</span>
                <span class="tip">
                    <button type="button" class="tip__btn" aria-expanded="false"
                            aria-controls="tip-news" data-i18n-aria="tip_more" aria-label="這是什麼">i</button>
                    <span class="tip__body" id="tip-news" role="tooltip" hidden>
                    <span data-i18n="rp_news_why">公告會出現在使用者的首頁與「最新消息」。置頂的排在最前面；沒有勾公開的只有你看得到，可以當草稿用。</span>
                    </span>
                </span>
            </h2>
            <span class="topbar__spacer"></span>
            <span class="footnote" id="news-sum"></span>
            <button class="btn btn--minor" type="button" id="news-new" data-i18n="rp_news_new">寫一則公告</button>
        </div>
        <!-- ZH: v3.9 公告表單改成彈窗（擁有者裁定 2026-08-30：減少頁面滑動）。
                 原本是展開在清單上方的一張卡，公告一多就得捲很久才回得到表單。
             ZH: 與問題回報那個同一套：原生 <dialog> + showModal()，
                 在 top layer 渲染、Esc 關閉、焦點鎖在框內，全部免費。
             ZH: 只用**一個** dialog，每次填內容 —— 一則一個的話，
                 一百則公告就有一百份隱藏的表單掛在 DOM 上。 -->
        <dialog class="rmod" id="news-dialog"></dialog>
        <div id="news" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
        <div class="inline-error" id="news-msg" hidden></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-reports">
        <div class="adm-sec__head"><h2 id="h-reports" data-i18n="adm_nav_reports">回報</h2></div>
        <!-- ZH: 每個篩選都帶數量 —— 不帶的話你得逐一點過才知道哪裡有事。 -->
        <div class="adm-inline" id="filters"></div>
        <!-- ZH: 類別另起一排（見 reports.js 的說明）。 -->
        <div class="adm-inline" id="cat-filters"></div>
        <div id="list" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
        <!-- ZH: 單則回報的彈窗。**只有一個**，每次填內容 ——
                 一則一個的話，一百則回報就有一百份隱藏的表單掛在 DOM 上。
             ZH: <dialog> 在 top layer 渲染，不受祖先的 transform/overflow 影響。 -->
        <dialog class="rmod" id="rp-dialog"></dialog>
    </section>

    <section class="adm-sec" aria-labelledby="h-mail">
        <div class="adm-sec__head">
            <!-- ZH: ⚠ id 在內層 span 上（section 用 aria-labelledby 指著它）——
                     留在 h2 上的話，可及名稱會把 icon 的 aria-label 一起唸進去。 -->
            <h2>
                <span id="h-mail" data-i18n="rp_mail">寄信紀錄</span>
                <span class="tip" id="mail-tip" hidden>
                    <button type="button" class="tip__btn" aria-expanded="false"
                            aria-controls="mail-tip-body" data-i18n-aria="tip_more" aria-label="這是什麼">i</button>
                    <!-- ZH: 內容由 reports.js 填（設定值是後端來的，不是固定文案）。
                             ⚠ 這裡**不要**掛 data-i18n —— 掛了的話，切語言時
                             prefs.js 會用字典把 JS 填進去的值整段蓋掉。 -->
                    <span class="tip__body" id="mail-tip-body" role="tooltip" hidden></span>
                </span>
            </h2>
        </div>
        <div id="mail" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-audit">
        <div class="adm-sec__head"><h2 id="h-audit" data-i18n="rp_audit">管理動作紀錄</h2></div>
        <div id="audit" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

</main>

<script src="tz.js?v=2e214a8b"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=bec7665d"></script>
<script src="i18n-admin.js?v=6821db74"></script>
<script src="tip.js?v=0699f4a2"></script>
<script src="prefs.js?v=00b43387"></script>
<script src="admin-chrome.js?v=ce2fd362"></script>
<script src="reports.js?v=258ef29b"></script>
</body>
</html>
