<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_people">人 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=68b37521">
    <link rel="stylesheet" href="admin.css?v=2b5275b9">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <!-- ZH: 入口是**搜尋**不是瀏覽 —— 打開這一頁的時候，你已經知道要找誰了。
             （總覽那頁才是「不知道要找什麼、先看一眼」。） -->
    <div class="adm-sec__head">
        <h1 class="hero__title" data-i18n="adm_nav_people">人</h1>
        <span class="topbar__spacer"></span>
        <span class="footnote" id="count"></span>
        <!-- ZH: 建立臨時帳號放在這一頁而不是另開一頁 ——
                 它跟「處理某一個人」是同一件事的兩端（開帳號 / 管帳號）。 -->
        <button class="btn btn--minor" type="button" id="new-temp" data-i18n="tmp_new">建立臨時帳號</button>
    </div>

    <!-- ZH: 預設收著。這是例外用途，不該佔掉每天都會看的版面。 -->
    <section class="adm-card adm-card--temp adm-sec" id="temp-box" hidden></section>

    <label class="field">
        <!-- ZH: 標籤用**短的**，長句留給 placeholder ——
                 兩邊寫同一句話時畫面上會看到重複的兩行。
                 （標籤不能省：placeholder 一打字就消失，
                   而 placeholder-only 的欄位對螢幕閱讀器也不友善。） -->
        <span class="field__label" for="q" data-i18n="pp_search_label">搜尋</span>
        <input class="field__input" id="q" type="search" autocomplete="off"
               data-i18n-placeholder="pp_search" placeholder="搜尋帳號、Email、學系…">
    </label>

    <section class="adm-sec" id="list" aria-live="polite">
        <span class="skeleton skeleton--line"></span>
    </section>

    <!-- ZH: 選中的人的**所有東西**都在這裡：基本資料、額度、實驗室、危險操作。
             舊版把這些散在「帳號管理」與「Lab 管理」兩個分頁，
             處理一個人要跳來跳去、而且兩邊各有一份搜尋。 -->
    <section class="adm-sec" id="detail" aria-live="polite"></section>

    <!-- ZH: 廠商帳號的維運工作。**數字與動作常駐** —— 有幾個人對不上、
             有幾個等著開通，正是你該注意到的事；收起來就等於沒有人會看到。
             很少用的 CSV 匯入才收進 fold。 -->
    <section class="adm-sec" aria-labelledby="h-batch">
        <div class="adm-sec__head">
            <h2 id="h-batch" data-i18n="pp_bx">廠商帳號對應</h2>
            <span class="topbar__spacer"></span>
            <span class="footnote" id="bx-sum"></span>
            <button class="btn btn--minor" type="button" id="bx-sync" data-i18n="pp_bx_sync">同步廠商帳號</button>
            <button class="btn btn--minor" type="button" id="bx-match" data-i18n="pp_bx_match">自動配對</button>
        </div>
        <p class="footnote" data-i18n="pp_bx_why">同步只是把廠商那邊的帳號與點數抓回來看；配對只寫平台這邊的對應表。兩者都不會改到廠商的資料。</p>
        <div class="inline-error" id="bx-msg" hidden></div>
        <div id="bx-body" aria-live="polite"><span class="skeleton skeleton--line"></span></div>

        <details class="fold">
            <summary class="fold__summary" data-i18n="pp_bx_csv">用 CSV 批次建立對應</summary>
            <div class="fold__body">
                <p class="footnote" data-i18n="pp_bx_csv_why">每行兩欄：平台帳號,廠商帳號。第一行如果是欄位名會自動略過。已存在的會更新，不會重複建立。</p>
                <label class="field">
                    <span class="field__label" for="bx-csv" data-i18n="pp_bx_csv_label">貼上 CSV</span>
                    <textarea class="field__input" id="bx-csv" rows="6"
                              placeholder="platform_username,vendor_username"></textarea>
                </label>
                <div class="ds__actions">
                    <button class="btn btn--minor" type="button" id="bx-import" data-i18n="pp_bx_import">匯入</button>
                </div>
                <div class="inline-error" id="bx-csv-msg" hidden></div>
            </div>
        </details>
    </section>

</main>

<script src="tz.js?v=2e214a8b"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=893f8ae0"></script>
<script src="i18n-admin.js?v=b98d2172"></script>
<script src="prefs.js?v=a25a96d6"></script>
<script src="admin-chrome.js?v=ca5eba9c"></script>
<script src="people.js?v=d588eab0"></script>
</body>
</html>
