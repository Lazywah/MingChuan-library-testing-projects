<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_people">帳號 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=13de82fd">
    <link rel="stylesheet" href="admin.css?v=cc67c2ea">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <!-- ZH: 入口是**搜尋**不是瀏覽 —— 打開這一頁的時候，你已經知道要找誰了。
             （總覽那頁才是「不知道要找什麼、先看一眼」。） -->
    <div class="adm-sec__head">
        <h1 class="hero__title" data-i18n="adm_nav_people">帳號</h1>
        <span class="topbar__spacer"></span>
        <span class="footnote" id="count" data-view="platform"></span>
        <!-- ZH: 建立臨時帳號放在這一頁而不是另開一頁 ——
                 它跟「處理某一個人」是同一件事的兩端（開帳號 / 管帳號）。 -->
        <button class="btn btn--minor" type="button" id="new-temp" data-view="platform"
                data-i18n="tmp_new">建立臨時帳號</button>
        <!-- ZH: v4.2 批次匯入（擁有者需求 2026-09-02）：整班/整團一次開。
                 同一個 <dialog> 重複用，內容由 people.js 的 openTempImport() 產生。 -->
        <button class="btn btn--minor" type="button" id="import-temp" data-view="platform"
                data-i18n="tmpi_new">匯入臨時帳號</button>
        <!-- ZH: 檢視滑條。與「平台設定」「數據」同一個元件 ——
                 它是**篩選**不是分頁：兩邊講的都是同一批帳號,
                 只是「平台這邊的資料」與「廠商那邊的對應」。
             ZH: 滑塊位置由 people.js 寫 inline transform。 -->
        <div class="adm-seg" id="view-seg" role="radiogroup"
             aria-label="要看哪一部分的帳號資料" data-i18n-aria="pp_view_group">
            <span class="adm-seg__thumb" aria-hidden="true" style="transform:translateX(0%)"></span>
            <button type="button" class="adm-seg__opt is-current" role="radio"
                    aria-checked="true" tabindex="0" data-view-opt="platform"
                    data-i18n="pf_view_platform">平台</button>
            <button type="button" class="adm-seg__opt" role="radio"
                    aria-checked="false" tabindex="-1" data-view-opt="myai"
                    data-i18n="pf_view_myai">MYAI</button>
        </div>
    </div>

    <!-- ZH: 預設收著。這是例外用途，不該佔掉每天都會看的版面。 -->
    <!-- ZH: 建立臨時帳號的彈窗（2026-08-30 從頁內卡片改成 <dialog>，
             與公告 / 問題回報同一套：原生 showModal()、top layer、單一 dialog 重複填。
             內容由 people.js 的 openTempForm() / showPassword() 產生。
         ZH: 🔴 密碼顯示階段會攔掉 ESC（cancel 事件）——密碼只出現一次，
             手滑 ESC 關掉就再也看不到了，只能按「知道了」或 ✕ 主動關。 -->
    <dialog class="rmod" id="temp-dialog"></dialog>

    <label class="field" data-view="platform">
        <!-- ZH: 標籤用**短的**，長句留給 placeholder ——
                 兩邊寫同一句話時畫面上會看到重複的兩行。
                 （標籤不能省：placeholder 一打字就消失，
                   而 placeholder-only 的欄位對螢幕閱讀器也不友善。） -->
        <span class="field__label" for="q" data-i18n="pp_search_label">搜尋</span>
        <input class="field__input" id="q" type="search" autocomplete="off"
               data-i18n-placeholder="pp_search" placeholder="搜尋帳號、Email、學系…">
    </label>

    <section class="adm-sec" id="list" data-view="platform" aria-live="polite">
        <span class="skeleton skeleton--line"></span>
    </section>

    <!-- ZH: 選中的人的**所有東西**都在這裡：基本資料、額度、實驗室、危險操作。
             舊版把這些散在「帳號管理」與「Lab 管理」兩個分頁，
             處理一個人要跳來跳去、而且兩邊各有一份搜尋。 -->
    <!-- ZH: v4.4 使用者詳情改彈窗＋名片頭（擁有者裁定 2026-09-03）：
             原本詳情整疊長在清單下面，看完要捲回去——改成 <dialog>，
             與公告/回報/臨時帳號同一套。內容仍由 people.js 的 renderDetail 產生。 -->
    <dialog class="rmod rmod--person" id="user-dialog" data-view="platform">
        <div id="detail" aria-live="polite"></div>
    </dialog>
    <!-- ZH: v4.4b 管理員密碼確認的小彈窗（擁有者裁定 2026-09-03）：
             停用/刪除/儲存前確認都走這一個。內容由 people.js 的 pwConfirm() 產生。 -->
    <dialog class="rmod rmod--pw" id="pw-dialog" data-view="platform"></dialog>

    <!-- ZH: 廠商帳號的維運工作。**數字與動作常駐** —— 有幾個人對不上、
             有幾個等著開通，正是你該注意到的事；收起來就等於沒有人會看到。
             很少用的 CSV 匯入才收進 fold。 -->
    <section class="adm-sec" data-view="myai" aria-labelledby="h-batch">
        <div class="adm-sec__head">
            <h2>
                <span id="h-batch" data-i18n="pp_bx">廠商帳號對應</span>
                <span class="tip">
                    <button type="button" class="tip__btn" aria-expanded="false"
                            aria-controls="tip-bx" data-i18n-aria="tip_more" aria-label="這是什麼">i</button>
                    <span class="tip__body" id="tip-bx" role="tooltip" hidden>
                    <span data-i18n="pp_bx_why">同步只是把廠商那邊的帳號與點數抓回來看；配對只寫平台這邊的對應表。兩者都不會改到廠商的資料。</span>
                    </span>
                </span>
            </h2>
            <span class="topbar__spacer"></span>
            <span class="footnote" id="bx-sum"></span>
            <button class="btn btn--minor" type="button" id="bx-sync" data-i18n="pp_bx_sync">同步廠商帳號</button>
            <button class="btn btn--minor" type="button" id="bx-match" data-i18n="pp_bx_match">自動配對</button>
        </div>
        <div class="inline-error" id="bx-msg" hidden></div>
        <div id="bx-body" aria-live="polite"><span class="skeleton skeleton--line"></span></div>

        <details class="fold">
            <summary class="fold__summary" data-i18n="pp_bx_csv">用 CSV 批次建立對應</summary>
            <div class="fold__body">
                <p class="footnote" data-i18n="pp_bx_csv_why">每行兩欄：平台帳號,廠商帳號。第一行如果是欄位名會自動略過。已存在的會更新，不會重複建立。</p>
                <label class="field">
                    <span class="field__label" for="bx-csv" data-i18n="pp_bx_csv_label">貼上 CSV</span>
                    <textarea class="field__input" id="bx-csv" rows="6"
                              placeholder="platform_username,vendor_username"></textarea>
                </label>
                <div class="ds__actions">
                    <button class="btn btn--minor" type="button" id="bx-import" data-i18n="pp_bx_import">匯入</button>
                </div>
                <div class="inline-error" id="bx-csv-msg" hidden></div>
            </div>
        </details>
    </section>

    <!-- ZH: v4.2 手動補齊點數（2026-09-02 從「平台設定」搬來，擁有者裁定）：
             它是對帳號的維運動作（把所有綁定帳號補到同一水位），
             跟上面的同步/配對是同一類事。兩段式（預覽 → 確認）不變 ——
             不可逆的操作先讓人看一眼再送出。 -->
    <section class="adm-sec" data-view="myai" aria-labelledby="h-topup">
        <div class="adm-sec__head">
            <h2>
                <span id="h-topup" data-i18n="pf_topup">手動補齊點數</span>
                <span class="tip">
                    <button type="button" class="tip__btn" aria-expanded="false"
                            aria-controls="tip-topup" data-i18n-aria="tip_more" aria-label="這是什麼">i</button>
                    <span class="tip__body tip__body--wide" id="tip-topup" role="tooltip" hidden>
                    <span class="tip__item" data-i18n="pf_topup_why">把所有綁定帳號補到同一個點數水位。低於這個數字的才會補，補的是差額；已經高於的不動。重複執行不會重複發放。給例外狀況用（活動、補償、每月補點當天服務沒起來）。</span>
                    <span class="tip__item" data-i18n="pf_topup_note">每月自動補點是另一回事，在「平台設定」的 MYAI 那一組（補到的點數、補點日）。這裡按下去是立刻執行，不看補點日。</span>
                    </span>
                </span>
            </h2>
            <span class="topbar__spacer"></span>
            <button class="btn btn--minor" type="button" id="tu-preview" data-i18n="pf_topup_preview">預覽</button>
            <button class="btn btn--primary" type="button" id="tu-apply" data-i18n="pf_topup_apply" hidden>確認補齊</button>
            <button class="btn btn--minor" type="button" id="tu-cancel" data-i18n="pf_topup_cancel" hidden>取消預覽</button>
        </div>
        <label class="field">
            <span class="field__label" data-i18n="pf_topup_target">補到的點數</span>
            <input class="field__input" type="number" id="tu-target" min="1" step="1" inputmode="numeric">
        </label>
        <!-- ZH: v4.2b 提醒在表格**上面**（擁有者裁定 2026-09-03）——
                 「幾個帳號、合計幾點」是決策資訊，要在捲名單之前看到。 -->
        <div class="inline-error" id="tu-msg" hidden></div>
        <div id="tu-result" aria-live="polite"></div>
    </section>

</main>

<script src="tz.js?v=2e214a8b"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=ac2b1380"></script>
<script src="i18n-admin.js?v=ce9bdd82"></script>
<script src="tip.js?v=0699f4a2"></script>
<script src="prefs.js?v=00b43387"></script>
<script src="admin-chrome.js?v=ce2fd362"></script>
<script src="people.js?v=7ee546ab"></script>
</body>
</html>
