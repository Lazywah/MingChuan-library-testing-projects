<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_analytics">數據 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=d4d21ce8">
    <link rel="stylesheet" href="admin.css?v=cdbdc994">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <!-- ZH: v4.45 頁首改用共用的 .adm-head（左「在看什麼」、右「能做什麼」）。
             期間▾、匯出▾ 是擁有者 2026-10-30 剛定案的，**位置與外觀都不動**，
             只是從「h1 + spacer」換成兩半的容器 —— 換行時右半整組靠右，不會把 h1 擠走。 -->
    <div class="adm-head">
        <div class="adm-head__what">
            <h1 class="adm-head__title" data-i18n="adm_nav_analytics">數據</h1>
        </div>
        <div class="adm-head__do">
            <!-- ZH: v4.44 期間收成一個下拉（擁有者 2026-10-30）。原本四顆快選＋起訖日期＋套用
                     排成一長條，跟匯出擠在同一列。選項由 analytics.js 產生（跟著語言切換）。
                 ZH: 起訖日期只在選了「自訂期間」時出現 —— 「近 30 天」是日常，
                     起訖是「我要整個 7 月」這種具體需求。下拉同時就是「現在看的是哪一段」，
                     不會出現兩邊都亮著、互相矛盾的狀態（原本要另外處理快選反白）。 -->
            <label class="an-range__lbl" for="period" data-i18n="an_period">期間</label>
            <select class="field__input an-range__d" id="period"></select>
            <div class="adm-inline" id="range" hidden>
                <label class="an-range__lbl" for="r-from" data-i18n="an_from">起</label>
                <input class="field__input an-range__d" id="r-from" type="date"
                       data-i18n-aria="an_from_aria" aria-label="起始日期">
                <label class="an-range__lbl" for="r-to" data-i18n="an_to">訖</label>
                <input class="field__input an-range__d" id="r-to" type="date"
                       data-i18n-aria="an_to_aria" aria-label="結束日期">
                <button class="btn btn--minor" type="button" id="r-go"
                        data-i18n="an_apply">套用</button>
            </div>

            <!-- ZH: 匯出。篩選條件跟畫面完全一致 —— 後端呼叫的是同一支函式。
                 ZH: v4.44 收成下拉（擁有者 2026-10-30）。原本刻意做成兩顆按鈕，理由是兩種格式的
                     內容**不一樣**（Excel 有多張分頁，CSV 只有帳號明細）—— 所以選單項目把差別
                     直接寫在名字上，選之前就看得到，而不是選完才發現少東西。
                 ZH: v4.45 選單頂端加一行組名「只含 MYAI 點數消耗」。這顆按鈕坐在頁首、緊鄰期間，
                     看起來像「匯出整頁」；實際上後端只匯 MYAI 那一支（consumption/export），
                     平台使用與訓練任務都不在檔案裡。同一個理由：選之前就要看得到差別。
                     組名是 role="presentation"，上下鍵只在兩個項目之間走（wireDropdown 只找 menuitem）。 -->
            <div class="account adm-dd" id="export">
                <button class="btn btn--minor" type="button" id="x-btn"
                        aria-haspopup="menu" aria-expanded="false" aria-controls="x-menu"><span
                        id="x-label" data-i18n="an_export">匯出</span> <span
                        class="account__caret" aria-hidden="true">▾</span></button>
                <div class="account__menu" role="menu" hidden id="x-menu">
                    <div class="adm-menu__label" role="presentation"
                         data-i18n="dz_an_export_scope">只含 MYAI 點數消耗</div>
                    <button type="button" role="menuitem" id="x-xlsx"
                            data-i18n="an_export_xlsx">Excel（全部分頁）</button>
                    <button type="button" role="menuitem" id="x-csv"
                            data-i18n="an_export_csv">CSV（只有帳號明細）</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ZH: 🔴 圖表全部自繪，**不引入 chart.js**。
             舊版用 chart.js 的預設樣式（灰底、預設藍綠、預設圖例），與頁面完全沒有整合；
             而且它是外部 CDN —— 圖書館對外連線受限或 CDN 掛掉時這一頁會整片壞掉。
         ZH: 🔴 也不畫圓餅。舊版那張「帳號狀態分佈」是一整片單色的圓（只有一個分類），
             完全不傳達資訊。橫條在任何筆數下都讀得出來，長度可以直接比。 -->

    <!-- ZH: v4.45 三段的標題列統一成 .adm-head。原本三段三種擺法（ⓘ＋spacer＋按鈕／光禿的 h2／
             下拉緊貼標題），右緣對不齊。區段之間的距離由 admin.css 的間距層級決定（64），
             圖與圖之間是細線＋24 —— 原本反過來（區段 32、圖之間 48），三段讀起來像同一段。 -->
    <section class="adm-sec" aria-labelledby="h-myai">
        <div class="adm-head">
            <div class="adm-head__what">
                <!-- ZH: ⚠ id 在內層 span 上 —— section 用 aria-labelledby 指著它，
                         留在 h2 上的話 icon 的 aria-label 會被算進可及名稱。 -->
                <h2 class="adm-head__title">
                    <span id="h-myai" data-i18n="an_myai">MYAI 點數消耗</span>
                    <span class="tip">
                        <button type="button" class="tip__btn" aria-expanded="false"
                                aria-controls="tip-myai-src" data-i18n-aria="tip_more" aria-label="這是什麼">i</button>
                        <span class="tip__body" id="tip-myai-src" role="tooltip" hidden
                              data-i18n="an_myai_src">資料來自廠商的交易日誌（逐筆、含模型）。點數是廠商計費的單位，不是平台自己的 Token。</span>
                    </span>
                </h2>
            </div>
            <div class="adm-head__do">
                <!-- ZH: 這一頁的數字全部來自廠商的交易日誌。日誌是定期同步來的，
                         所以「資料看起來不對」十次有九次是還沒同步 ——
                         把重新同步放在這裡，就不必為了這件事跑去別的頁面。 -->
                <button class="btn btn--minor" type="button" id="sync" data-i18n="an_sync">向廠商重新同步</button>
            </div>
        </div>
        <div class="inline-error" id="sync-msg" hidden></div>
        <div id="myai" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-jobs">
        <div class="adm-head">
            <div class="adm-head__what">
                <h2 class="adm-head__title" id="h-jobs" data-i18n="an_jobs">訓練任務</h2>
                <!-- ZH: v4.45 明講這一段**不吃**頁首的期間。analytics.js 抓的是
                         /admin/jobs?limit=500（後端依建立時間新到舊取 500 筆），沒有期間參數 ——
                         原本畫面上看不出來，選了「近 7 天」這裡卻還是全部的數字。
                         這是誠實標示現況，不是假裝套用了期間（要真的吃期間得先改後端）。 -->
                <span class="adm-head__meta" data-i18n="dz_an_jobs_noperiod">不受期間影響（最近 500 筆）</span>
            </div>
        </div>
        <div id="jobs" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-platform">
        <div class="adm-head">
            <div class="adm-head__what">
                <h2 class="adm-head__title" id="h-platform" data-i18n="an_platform">平台使用</h2>
                <!-- ZH: v3.8 #13 —— 分組方式。選項不寫死在這裡的 label 文字上，
                     **值才是契約**（後端 get_analytics 只認固定那幾個，
                     加新的要兩邊一起改）。
                     目前：college / department / unit / campus / role。 -->
                <label class="adm-head__filter">
                    <span data-i18n="an_group_by">分組方式</span>
                    <select class="field__input" id="an-group">
                        <option value="college" data-i18n="an_by_college">學院</option>
                        <option value="department" selected data-i18n="an_by_dept">學系</option>
                        <option value="unit" data-i18n="an_by_unit">單位</option>
                        <option value="campus" data-i18n="an_by_campus">校區</option>
                        <option value="role" data-i18n="an_by_rolegrp">身分</option>
                    </select>
                </label>
            </div>
        </div>
        <div id="platform" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

</main>

<script src="tz.js?v=2e214a8b"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=6de7dc28"></script>
<script src="i18n-admin.js?v=2a602f73"></script>
<script src="tip.js?v=0699f4a2"></script>
<script src="prefs.js?v=e71609e5"></script>
<script src="admin-chrome.js?v=6c9efcda"></script>
<script src="analytics.js?v=e53e329a"></script>
</body>
</html>
