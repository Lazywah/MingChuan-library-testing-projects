<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_analytics">數據 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=68b37521">
    <link rel="stylesheet" href="admin.css?v=2b5275b9">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <div class="adm-sec__head">
        <h1 class="hero__title" data-i18n="adm_nav_analytics">數據</h1>
        <span class="topbar__spacer"></span>
        <span class="footnote" data-i18n="an_period">期間</span>
        <div class="adm-inline" id="periods"></div>
    </div>

    <!-- ZH: 🔴 圖表全部自繪，**不引入 chart.js**。
             舊版用 chart.js 的預設樣式（灰底、預設藍綠、預設圖例），與頁面完全沒有整合；
             而且它是外部 CDN —— 圖書館對外連線受限或 CDN 掛掉時這一頁會整片壞掉。
         ZH: 🔴 也不畫圓餅。舊版那張「帳號狀態分佈」是一整片單色的圓（只有一個分類），
             完全不傳達資訊。橫條在任何筆數下都讀得出來，長度可以直接比。 -->

    <section class="adm-sec" aria-labelledby="h-myai">
        <div class="adm-sec__head">
            <h2 id="h-myai" data-i18n="an_myai">MYAI 點數消耗</h2>
            <span class="topbar__spacer"></span>
            <!-- ZH: 這一頁的數字全部來自廠商的交易日誌。日誌是定期同步來的，
                     所以「資料看起來不對」十次有九次是還沒同步 ——
                     把重新同步放在這裡，就不必為了這件事跑去別的頁面。 -->
            <button class="btn btn--minor" type="button" id="sync" data-i18n="an_sync">向廠商重新同步</button>
        </div>
        <div class="inline-error" id="sync-msg" hidden></div>
        <div id="myai" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-jobs">
        <div class="adm-sec__head"><h2 id="h-jobs" data-i18n="an_jobs">訓練任務</h2></div>
        <div id="jobs" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-platform">
        <div class="adm-sec__head"><h2 id="h-platform" data-i18n="an_platform">平台使用</h2></div>
        <div id="platform" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

</main>

<script src="tz.js?v=2e214a8b"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=265e2077"></script>
<script src="i18n-admin.js?v=b98d2172"></script>
<script src="prefs.js?v=a25a96d6"></script>
<script src="admin-chrome.js?v=ca5eba9c"></script>
<script src="analytics.js?v=379b139f"></script>
</body>
</html>
