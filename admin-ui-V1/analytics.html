<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="adm_t_analytics">數據 · MCU AI Base 管理端</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=4bd632c4">
    <link rel="stylesheet" href="admin.css?v=3d45d601">
</head>
<body>

<!-- ZH: 頂部列由 admin-chrome.js 產生（唯一真相來源）。 -->

<main class="page page--admin">

    <div class="adm-sec__head">
        <h1 class="hero__title" data-i18n="adm_nav_analytics">數據</h1>
        <span class="topbar__spacer"></span>
        <span class="footnote" data-i18n="an_period">期間</span>
        <div class="adm-inline" id="periods"></div>

        <!-- ZH: 起訖日期。不取代上面的快選 —— 「近 30 天」是日常，
                 起訖是「我要整個 7 月」這種具體需求，兩者共存。
             ZH: 選了日期之後快選會取消反白 —— 兩邊都亮著的話，
                 畫面會講兩個互相矛盾的事。 -->
        <div class="adm-inline" id="range">
            <label class="an-range__lbl" for="r-from" data-i18n="an_from">起</label>
            <input class="field__input an-range__d" id="r-from" type="date"
                   data-i18n-aria="an_from_aria" aria-label="起始日期">
            <label class="an-range__lbl" for="r-to" data-i18n="an_to">訖</label>
            <input class="field__input an-range__d" id="r-to" type="date"
                   data-i18n-aria="an_to_aria" aria-label="結束日期">
            <button class="btn btn--minor" type="button" id="r-go"
                    data-i18n="an_apply">套用</button>
            <button class="btn btn--minor" type="button" id="r-clear" hidden
                    data-i18n="an_clear">清除</button>
        </div>

        <!-- ZH: 匯出。篩選條件跟畫面完全一致 —— 後端呼叫的是同一支函式。
             ZH: 兩種格式的內容**不一樣**，所以不做成下拉選單：
                 Excel 有七張分頁，CSV 只有帳號明細（CSV 沒有分頁這回事）。
                 兩顆按鈕各自講清楚，比選完才發現少東西好。 -->
        <div class="adm-inline" id="export">
            <button class="btn btn--minor" type="button" id="x-xlsx"
                    data-i18n="an_export_xlsx">匯出 Excel</button>
            <button class="btn btn--minor" type="button" id="x-csv"
                    data-i18n="an_export_csv">匯出 CSV</button>
        </div>
    </div>

    <!-- ZH: 🔴 圖表全部自繪，**不引入 chart.js**。
             舊版用 chart.js 的預設樣式（灰底、預設藍綠、預設圖例），與頁面完全沒有整合；
             而且它是外部 CDN —— 圖書館對外連線受限或 CDN 掛掉時這一頁會整片壞掉。
         ZH: 🔴 也不畫圓餅。舊版那張「帳號狀態分佈」是一整片單色的圓（只有一個分類），
             完全不傳達資訊。橫條在任何筆數下都讀得出來，長度可以直接比。 -->

    <section class="adm-sec" aria-labelledby="h-myai">
        <div class="adm-sec__head">
            <h2 id="h-myai" data-i18n="an_myai">MYAI 點數消耗</h2>
            <span class="topbar__spacer"></span>
            <!-- ZH: 這一頁的數字全部來自廠商的交易日誌。日誌是定期同步來的，
                     所以「資料看起來不對」十次有九次是還沒同步 ——
                     把重新同步放在這裡，就不必為了這件事跑去別的頁面。 -->
            <button class="btn btn--minor" type="button" id="sync" data-i18n="an_sync">向廠商重新同步</button>
        </div>
        <div class="inline-error" id="sync-msg" hidden></div>
        <div id="myai" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-jobs">
        <div class="adm-sec__head"><h2 id="h-jobs" data-i18n="an_jobs">訓練任務</h2></div>
        <div id="jobs" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

    <section class="adm-sec" aria-labelledby="h-platform">
        <div class="adm-sec__head"><h2 id="h-platform" data-i18n="an_platform">平台使用</h2>
            <!-- ZH: v3.8 #13 —— 依學院／學系／行政單位分組。
                 選項不寫死在這裡的 label 文字上，值才是契約（後端只認這三個）。 -->
            <label class="adm-sec__tool">
                <span data-i18n="an_group_by">分組方式</span>
                <select class="field__input" id="an-group">
                    <option value="college" data-i18n="an_by_college">學院</option>
                    <option value="department" selected data-i18n="an_by_dept">學系</option>
                    <option value="unit" data-i18n="an_by_unit">單位</option>
                </select>
            </label>
        </div>
        <div id="platform" aria-live="polite"><span class="skeleton skeleton--line"></span></div>
    </section>

</main>

<script src="tz.js?v=2e214a8b"></script>
<!-- ⚠ ZH: 順序不能動 —— i18n-admin 在 i18n 之後、prefs 之前。 -->
<script src="i18n.js?v=d36d89a7"></script>
<script src="i18n-admin.js?v=c6ba52bf"></script>
<script src="prefs.js?v=a25a96d6"></script>
<script src="admin-chrome.js?v=6d90183a"></script>
<script src="analytics.js?v=f071ccb6"></script>
</body>
</html>
