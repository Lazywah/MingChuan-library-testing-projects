<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="jl_title">我的訓練 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=e6a0b3ae">
    <link rel="stylesheet" href="web.css?v=5bc67d52">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')!=='0')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。 -->
</header>

<main class="page page--narrow">

    <!-- ==================================================================
         ZH: 這一頁存在的理由：**送出之後關掉分頁就再也找不回那張單。**
             看不到進度、拿不到模型、也不知道到底跑完了沒有——
             而訓練通常要好幾分鐘到幾十分鐘，沒有人會一直開著那一頁等。
         ================================================================== -->
    <section class="primary-card" aria-labelledby="jl-title">
        <h1 class="hero__title" id="jl-title" data-i18n="jl_h1">我的訓練</h1>
        <p class="hero__sub" data-i18n="jl_sub">你送出過的訓練都在這裡。點進去看進度與結果，跑完的可以下載模型。</p>
    </section>

    <!-- ZH: 只有「還在跑」與「全部」兩個選項。狀態有六種，但使用者實際會問的
             只有「我那張跑完了沒」——多給四個篩選鈕只是讓他多想一次。 -->
    <div class="seg" role="group" aria-label="篩選" data-i18n-aria="jl_filter_aria">
        <button type="button" data-filter="" aria-pressed="true" data-i18n="jl_all">全部</button>
        <button type="button" data-filter="active" aria-pressed="false" data-i18n="jl_active">還在跑</button>
    </div>

    <div id="list" aria-live="polite">
        <span class="skeleton skeleton--line"></span>
        <span class="skeleton skeleton--line"></span>
    </div>

    <nav class="minor">
        <a href="train.html" data-i18n="jl_new">開始一個新的訓練</a>
        <a href="datasets.html" data-i18n="nav_datasets">我的資料集</a>
    </nav>

</main>

<script src="tz.js?v=2e214a8b"></script>
<script src="i18n.js?v=bc17c7f6"></script>
<script src="prefs.js?v=a25a96d6"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=61a7acaa"></script>
<script src="chrome.js?v=bbebeb51"></script>
<script src="jobs.js?v=8e0451d1"></script>
</body>
</html>
