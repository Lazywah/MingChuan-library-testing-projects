<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="usage_title">使用量明細 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=e6a0b3ae">
    <link rel="stylesheet" href="web.css?v=5bc67d52">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')!=='0')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>

    <!-- ZH: 與 v1.5 同一個來源，避免兩份 UI 各自帶不同版本的圖表庫。 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->
</header>

<main class="page">

    <!-- ZH: 層級 1 —— **重述當前額度**（C3 修正 / D4）。
             使用者是「看著額度覺得快沒了」才點進來的；獨立頁若不重述，
             他就得回上一頁才記得起自己剩多少。v1.5 把餘額縮在角落的小灰字，
             那是把決策資訊當成裝飾。 -->
    <section class="primary-card" aria-labelledby="bal-label">
        <div class="balance__label" id="bal-label" data-i18n="bal_label">我的 AI 額度</div>
        <div class="balance__value">
            <span id="bal-value"><span class="skeleton" aria-hidden="true"></span></span><span
                class="balance__unit" id="bal-unit" hidden>Token</span>
        </div>
        <div class="balance__meta" id="bal-meta"></div>
        <p class="hint" id="reset-note" hidden></p>
    </section>

    <!-- 期間切換。ZH: 「全部」送 days=0 —— 後端曾把 0 當 falsy 換成 30（已修）。 -->
    <div class="seg" role="group" aria-label="統計期間" data-i18n-aria="usage_range_aria">
        <button type="button" data-days="30" aria-pressed="true" data-i18n="usage_r30">近 30 天</button>
        <button type="button" data-days="90" aria-pressed="false" data-i18n="usage_r90">近 90 天</button>
        <button type="button" data-days="0" aria-pressed="false" data-i18n="docs_all">全部</button>
    </div>

    <!-- 訊息區：未綁定 / 無資料 / 錯誤 都落在這裡，**圖表區隨之隱藏** -->
    <div class="inline-error" id="msg" hidden></div>

    <div id="content" hidden>
        <!-- 三個數字。有對照時各自掛「全體人均」 -->
        <div class="stats" id="stats"></div>

        <!-- ZH: 樣本不足時要說明為什麼沒有對照，不能讓人以為壞了。
                 隱私邊界：人均在樣本太少時會反推出特定個人（後端 MIN_PEER_COHORT）。 -->
        <p class="hint" id="no-peer" hidden></p>

        <section class="chart">
            <h2 class="chart__title" data-i18n="usage_daily">每日消耗趨勢</h2>
            <div class="chart__box"><canvas id="trend"></canvas></div>
        </section>

        <section class="chart">
            <h2 class="chart__title" data-i18n="usage_models">我用了哪些模型／工具</h2>
            <div class="chart__box"><canvas id="models"></canvas></div>
            <p class="hint" id="models-more" hidden></p>
        </section>
    </div>

</main>

<script src="i18n.js?v=32bb64a5"></script>
<script src="prefs.js?v=a25a96d6"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=61a7acaa"></script>
<script src="chrome.js?v=0c8907be"></script>
<script src="usage.js?v=72cd82cf"></script>
</body>
</html>
