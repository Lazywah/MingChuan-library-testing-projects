<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="idx_title">MCU AI Base</title>

    <!-- ZH: Open Sans —— 與學校 Moodle 的 Latin 字體一致。
             中文由 tokens.css 的字體堆疊釘住微軟正黑（字體 fallback 逐字生效）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=13de82fd">
    <link rel="stylesheet" href="web.css?v=4a234c4e">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')==='1')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->

</header>

<main class="page">

    <!-- ZH: 層級 0 · 公告。條件式——沒有公告時整塊不存在，
             不做「目前沒有公告」的空卡片。
         ZH: 內容由 app.js 填（至多 7 則，置頂排最前）。
             置頂的判定在**後端**（announcements 端點已經將 is_pinned 排在前面），
             前端只負責把那個旗標畫出來 —— 不要在這裡重新排序。 -->
    <section class="news" id="news" hidden aria-labelledby="news-h">
        <h2 class="news__h" id="news-h" data-i18n="idx_news_h">公告</h2>
        <ul class="news__list" id="news-list"></ul>
        <a class="news__all" id="news-all" href="news.html"
           data-i18n="idx_news_all">看全部公告</a>
    </section>

    <!-- ==================================================================
         ZH: 層級 2 · 分組卡片（B 方案，分類由 v3.9 重新分配）。

         ZH: 取代了原本的「第一次來？照這個順序走」流程條與「隨時可以去」那排小鈕。
             流程條講得出先後，但它只講得出**一條**路，而平台其實有好幾條。
             卡片講得出「你想做什麼」，代價是**看不出先後順序**，也看不出誰是誰的
             子項 —— 這是已知的取捨，不是疏漏。

         ZH: 分類的判準是**「使用者是帶著什麼念頭來的」**，不是功能相似度：
               想做點什麼 → 我要開始（三個入口，各自通往一條路）
               看我的東西 → 我已經做過了，東西在哪
               不知道怎麼做 → 我卡住了，或我想先看看別人怎麼做

         ZH: 為什麼不照功能分（「訓練相關」「帳務相關」）：新生不知道自己要的功能
             叫什麼名字。他知道的是「我想訓練一個模型」與「我的東西在哪」。

         ZH: 卡片寫在 HTML 裡而不是 JS 產生 —— 文案要帶 data-i18n
             才能被 check_untranslated_html 與 check_i18n 機械檢查到。

         ZH: ⚠ 文件庫那張帶 data-docs-entry —— 沒內容時 docs-entry.js 會讓它留在
             hidden，那一組就少一格（卡片不編號，少一格沒有副作用）。

         ZH: 🚫 **公告不進卡片** —— 首頁上方已經有專屬區塊（`.news`）。
             那才是真正的重複入口。
         ZH: v3.9 這裡原本還寫著「初始密碼不進卡片，因為 #handoff 在上面」——
             那塊已經跟著額度卡搬去 myai.html，首頁上不再有 #handoff。
         ZH: 🚫 **train.html（交給平台訓練）不另開一張** —— gpu.html 的整個工作
             就是把「交給平台」與「自己開實驗室」兩條路攤開來讓人選。
             另開一張會變成兩張看起來很像的卡，而使用者分不出差別。
         ================================================================== -->
    <section class="groups" aria-labelledby="groups-h">
        <h2 class="sr-only" id="groups-h" data-i18n="idx_groups_h">你想做什麼</h2>

        <div class="group">
            <h3 class="group__h">
                <span data-i18n="grp_do_t">想做點什麼</span>
                <span class="group__sub" data-i18n="grp_do_d">三條路，挑一條</span>
            </h3>
            <div class="group__cards">
                <!-- ZH: v3.9 這一格從「按鈕 + JS 分流」變成**單純的連結**。
                         額度卡與 goMyai() 都搬去 myai.html 了，
                         這裡不需要再知道「開通了沒」—— 那件事由那一頁自己判斷。 -->
                <a class="gcard gcard--lead" href="myai.html">
                    <span class="gcard__t" data-i18n="grp_ai_t">體驗大模型</span>
                    <span class="gcard__d" data-i18n="grp_ai_d">MYAI 平台，聊天與文書</span>
                </a>
                <a class="gcard" href="gpu.html">
                    <span class="gcard__t" data-i18n="grp_go_t">體驗現有模型訓練</span>
                    <span class="gcard__d" data-i18n="grp_go_d">從貓狗範例開始，約 20 分鐘</span>
                </a>
                <a class="gcard" href="lab.html">
                    <span class="gcard__t" data-i18n="nav_lab">程式實驗室</span>
                    <span class="gcard__d" data-i18n="step_lab_d">瀏覽器裡的 VS Code</span>
                </a>
            </div>
        </div>

        <div class="group">
            <h3 class="group__h">
                <span data-i18n="grp_mine_t">看我的東西</span>
                <span class="group__sub" data-i18n="grp_mine_d">做過的、存過的、用掉的</span>
            </h3>
            <div class="group__cards">
                <a class="gcard" href="jobs.html">
                    <span class="gcard__t" data-i18n="grp_jobs_t">我的訓練進度</span>
                    <span class="gcard__d" data-i18n="grp_jobs_d">看進度與結果</span>
                </a>
                <!-- ZH: 🔴 資料集歸在這裡不是「想寫程式」——
                         資料集是**訓練**用的（送出訓練時上傳那包 zip），
                         寫程式的人反而多半不碰它。歸錯的話想訓練的人找不到。 -->
                <a class="gcard" href="datasets.html">
                    <span class="gcard__t" data-i18n="grp_ds_t">我的歷史資料訓練</span>
                    <span class="gcard__d" data-i18n="grp_ds_d">訓練用的圖片，上傳與管理</span>
                </a>
                <a class="gcard" href="usage.html">
                    <span class="gcard__t" data-i18n="acct_usage">使用量明細</span>
                    <span class="gcard__d" data-i18n="grp_usage_d">AI 額度用在哪</span>
                </a>
            </div>
        </div>

        <div class="group">
            <h3 class="group__h">
                <span data-i18n="grp_help_t">不知道怎麼做</span>
                <span class="group__sub" data-i18n="grp_help_d">或是卡住了</span>
            </h3>
            <div class="group__cards">
                <!-- ZH: 🔴 文件庫歸在這裡不是「想用 AI」——
                         它是教學與別人的作品，**三條路都會用到**。
                         掛在其中一條下面，走另外兩條的人就以為那跟自己無關。 -->
                <a class="gcard" href="docs.html" data-docs-entry hidden>
                    <span class="gcard__t" data-i18n="entry_docs_title">看別人做過什麼</span>
                    <span class="gcard__d" data-i18n="entry_docs_desc">同學的作品與教學影片</span>
                </a>
                <!-- ZH: 🔴 這裡原本有一張「GPU 現在忙不忙」，指向 `gpu.html#status`。
                         **拿掉了 —— 那個錨點不存在，而且平台沒有任何 GPU 狀態頁**。
                         點下去只會跳到「做出一個能分辨貓和狗的模型」的頁首，
                         而那是教學頁不是狀態頁。
                     ZH: 它想回答的問題（「我的任務為什麼還沒開始」）現在由
                         **我的訓練**回答 —— 排隊中的任務會直接寫出位置與原因
                         （前面還有幾個／有人在用實驗室的 GPU／不在開放時段）。
                         那一頁已經在上面那一組，不需要第二個入口。
                     ZH: 若之後真的要做一個獨立的 GPU 狀態頁，再把卡加回來。
                -->
                <a class="gcard" href="report.html">
                    <span class="gcard__t" data-i18n="acct_report">問題回報</span>
                    <span class="gcard__d" data-i18n="grp_report_d">遇到問題告訴我們</span>
                </a>
            </div>
        </div>
    </section>
</main>

<script src="docs-entry.js?v=131ee7af"></script>
<script src="i18n.js?v=ac2b1380"></script>
<script src="prefs.js?v=00b43387"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=74e3c4b6"></script>
<script src="chrome.js?v=eafe98a2"></script>
<script src="app.js?v=7a754355"></script>
</body>
</html>
