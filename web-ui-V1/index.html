<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="idx_title">MCU AI Base</title>

    <!-- ZH: Open Sans —— 與學校 Moodle 的 Latin 字體一致。
             中文由 tokens.css 的字體堆疊釘住微軟正黑（字體 fallback 逐字生效）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=d4d21ce8">
    <link rel="stylesheet" href="web.css?v=bd588ac0">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')==='1')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->

</header>

<main class="page page--home">

    <!-- ZH: v4.25 首頁重排（老師回饋「資訊量太多」，擁有者草稿 2026-09-23）：
             **公告（整寬）→ 三主線（1→2→3）→ 到訪人次**，一條一條往下讀。

         ZH: 🔴 v4.7 的「公告｜功能卡 左右並排」（`.home` 兩欄）**拆掉了**。
             當初那個版面的代價寫在 web.css:734：公告佔一半，功能卡一排就只
             放得下兩張。現在功能卡只剩三張主線，它們需要的是整頁寬度。

         ZH: 🔴 **首頁不再是完整的入口目錄。** 個人使用紀錄與其他入口
             （訓練進度、資料集、使用量、文件庫、GPU 狀態、問題回報）
             只留在頂部列的下拉 —— 那才是完整目錄（擁有者裁定 2026-09-23）。
             ⚠ 所以 chrome.js 的 GROUPS **不再是這一頁的鏡像**，
             那段註解已經一併改掉；兩邊現在是「目錄」與「主線」的關係。 -->

    <!-- ZH: 層級 0 · 公告。條件式——沒有公告時整塊不存在，
             不做「目前沒有公告」的空卡片。
         ZH: 內容由 app.js 填（至多 7 則，置頂排最前）。
             置頂的判定在**後端**（announcements 端點已經將 is_pinned 排在前面），
             前端只負責把那個旗標畫出來 —— 不要在這裡重新排序。 -->
    <section class="news news--wide" id="news" hidden aria-labelledby="news-h">
        <h2 class="news__h" id="news-h" data-i18n="idx_news_h">公告</h2>
        <ul class="news__list" id="news-list"></ul>
        <a class="news__all" id="news-all" href="news.html"
           data-i18n="idx_news_all">看全部公告</a>
    </section>

    <!-- ==================================================================
         ZH: 三主線（v4.25，擁有者草稿 2026-09-23）

         ZH: 老師的回饋是「資訊量太多」。原本三組共 8 張卡權重都一樣，
             第一次來的人得自己從 8 個選項裡挑一個 —— 那不是選擇，是負擔。
             現在只留三條主線，而且**講出先後**：1 → 2 → 3 由淺入深。

         ZH: 🔴 這等於把 v3.9 拿掉的「流程條」請回來一半 ——
             當初拿掉的理由是「流程條只講得出一條路，而平台有好幾條」
             （原文留在 git history）。這次不同的地方是：
             這三條**不是同一條路的三個步驟**，是三個深度的入口，
             編號表達的是「建議從哪裡開始」，不是「必須照順序做完」。
             所以每一格都是獨立的連結，跳著點沒有任何副作用。

         ZH: ⚠ 箭頭是**裝飾**（aria-hidden）—— 順序已經由編號與閱讀順序表達，
             螢幕閱讀器再念一次「大於符號」只是雜訊。
         ZH: ⚠ 手機一欄時箭頭會不見（web.css 的 .lines__arrow）：
             直排本身就表達得出先後，橫向箭頭在直排裡是錯的方向。
         ========================================================================= -->
    <section class="lines" aria-labelledby="lines-h">
        <h2 class="sr-only" id="lines-h" data-i18n="idx_lines_h">從哪裡開始</h2>

        <a class="line" href="myai.html" data-tour="ai">
            <span class="line__n" aria-hidden="true">1</span>
            <span class="line__t" data-i18n="grp_ai_t">體驗付費版 AI 工具</span>
            <span class="line__d" data-i18n="grp_ai_d">MYAI 平台，聊天與文書</span>
        </a>
        <span class="lines__arrow" aria-hidden="true">›</span>
        <a class="line" href="gpu.html" data-tour="train">
            <span class="line__n" aria-hidden="true">2</span>
            <span class="line__t" data-i18n="grp_go_t">體驗現有模型訓練</span>
            <span class="line__d" data-i18n="grp_go_d">從訓練 AI 辨識貓狗開始，約 20 分鐘</span>
        </a>
        <span class="lines__arrow" aria-hidden="true">›</span>
        <a class="line" href="lab.html" data-tour="lab">
            <span class="line__n" aria-hidden="true">3</span>
            <span class="line__t" data-i18n="nav_lab">程式實驗室</span>
            <span class="line__d" data-i18n="step_lab_d">動手寫程式，建立並訓練自己的 AI 模型</span>
        </a>
    </section>



    <!-- ZH: 到訪人次（v4.24，擁有者需求 2026-09-23）。登入頁也有同一塊 ——
             未登入的人看到的是那一頁（這一頁沒登入會被導走）。
         ZH: 🔴 **必須放在 `.home` 外面。** `.home` 是「公告｜功能卡」的兩欄
             flex 容器（web.css:739），放進去它就變成第三欄，被擠到右邊那片
             空白裡 —— 2026-09-23 第一版就是這樣歪掉的。
             它是整頁最底下的一條橫線（styles.css 的 .visits 就是那樣設計的），
             所以位置是 `main` 的最後一個子元素，不要再進任何 flex/grid 容器。
             ZH: 🔴 寫「人次」不是「人數」—— 同一位訪客**當天**只算一次，
                 但隔天再來會再算一次。寫成「人數」的話，一個每天來的人
                 會讓數字每天 +1，看的人會以為那是新的人。
             ZH: 預設 hidden，有數字才顯示（chrome.js 填）——
                 後端讀不到時寧可整塊不出現，也不要留三個 0 在那裡
                 （0 會被當成「真的沒有人來」）。 -->
    <footer class="visits" data-visits hidden>
        <span class="visits__item">
            <span class="visits__label" data-i18n="visits_today">本日到訪</span>
            <span class="visits__n" data-visits-today>–</span>
        </span>
        <span class="visits__item">
            <span class="visits__label" data-i18n="visits_month">本月到訪</span>
            <span class="visits__n" data-visits-month>–</span>
        </span>
        <span class="visits__item">
            <span class="visits__label" data-i18n="visits_total">累計到訪</span>
            <span class="visits__n" data-visits-total>–</span>
        </span>
        <span class="visits__note" data-i18n="visits_note">（人次；同一位訪客當天只算一次）</span>
    </footer>
</main>

<script src="docs-entry.js?v=131ee7af"></script>
<script src="i18n.js?v=66c3d3af"></script>

<script src="assistant-widget.js?v=74e3c4b6"></script>
<script src="chrome.js?v=47c80038"></script>
<script src="app.js?v=b73ba689"></script>
<!-- ZH: 到訪人次。每一頁都載（這是「網站」的計數，不是首頁的），一個工作階段只送一次；

<script src="visits.js"></script>
<!-- ZH: 引導導覽。每一頁都載是因為它**跨頁**（首頁→MYAI→訓練進度→使用量→問題回報），

         沒登入就什麼都不做。 -->
<script src="tour.js?v=066221a7"></script>
</body>
</html>
