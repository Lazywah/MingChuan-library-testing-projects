<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="idx_title">MCU AI Base</title>

    <!-- ZH: Open Sans —— 與學校 Moodle 的 Latin 字體一致。
             中文由 tokens.css 的字體堆疊釘住微軟正黑（字體 fallback 逐字生效）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=e6a0b3ae">
    <link rel="stylesheet" href="web.css?v=5bc67d52">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')!=='0')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->

</header>

<main class="page">

    <!-- ZH: 層級 0 · 公告。條件式——沒有公告時整塊不存在，
             不做「目前沒有公告」的空卡片。
         ZH: 內容由 app.js 填（至多 7 則，置頂排最前）。
             置頂的判定在**後端**（announcements 端點已經將 is_pinned 排在前面），
             前端只負責把那個旗標畫出來 —— 不要在這裡重新排序。 -->
    <section class="news" id="news" hidden aria-labelledby="news-h">
        <h2 class="news__h" id="news-h" data-i18n="idx_news_h">公告</h2>
        <ul class="news__list" id="news-list"></ul>
        <a class="news__all" id="news-all" href="news.html"
           data-i18n="idx_news_all">看全部公告</a>
    </section>

    <!-- 層級 1 · 額度 + 主要動作 -->
    <section class="primary-card" id="balance-card" aria-labelledby="balance-label">
        <div class="balance__label" id="balance-label" data-i18n="bal_label">我的 AI 額度</div>

        <div class="balance__value">
            <span id="balance-value"><span class="skeleton" aria-hidden="true"></span></span><span
                class="balance__unit" id="balance-unit" hidden>Token</span>
        </div>

        <div class="balance__meta" id="balance-meta"></div>

        <!-- ZH: V1 修正——標籤要講明真實結果。
                 實際流程是「開廠商登出頁 → 1 秒後轉登入頁」，落地是登入表單不是對話框。 -->
        <button class="btn btn--primary" id="go-myai" type="button" data-i18n="idx_go_myai">
            前往 MYAI 問 AI
        </button>
        <div class="handoff" id="handoff" hidden></div>
    </section>

    <!-- ==================================================================
         ZH: 層級 2 · 引導流程。
             步驟寫在 HTML 裡（而不是 JS 產生），是為了讓文案帶 data-i18n、
             能被 check_untranslated_html 與 check_i18n 機械檢查到。
             **狀態標籤由 app.js 填**（現在在這/下一步/已完成）。

         ZH: ⚠ 文件庫那一步帶 data-docs-entry，沒內容時會被 docs-entry.js
             留在 hidden —— 所以步驟**不能寫死編號**（一、二、三），
             否則文件庫一消失就會跳號。狀態標籤是 app.js **篩掉隱藏項之後**才排的。
         ================================================================== -->
    <section class="flow" id="flow" hidden aria-labelledby="flow-h">
        <h2 class="flow__h" id="flow-h" data-i18n="idx_flow_h">第一次來？照這個順序走</h2>
        <ol class="flow__steps" id="flow-steps">
            <li class="flow__item">
                <a class="step" id="step-myai" href="provision.html">
                    <span class="step__state" data-state></span>
                    <span class="step__title" data-i18n="step_myai_t">開通 MYAI</span>
                    <span class="step__desc" data-i18n="step_myai_d">綁定學校信箱，拿到點數</span>
                </a>
            </li>
            <li class="flow__item" data-docs-entry hidden>
                <a class="step" id="step-docs" href="docs.html">
                    <span class="step__state" data-state></span>
                    <span class="step__title" data-i18n="entry_docs_title">看別人做過什麼</span>
                    <span class="step__desc" data-i18n="entry_docs_desc">同學的作品與教學影片</span>
                </a>
            </li>
            <li class="flow__item">
                <a class="step" id="step-lab" href="lab.html">
                    <span class="step__state" data-state></span>
                    <span class="step__title" data-i18n="step_lab_t">開實驗室寫程式</span>
                    <span class="step__desc" data-i18n="step_lab_d">瀏覽器裡的 VS Code</span>
                </a>
            </li>
            <li class="flow__item">
                <a class="step" id="step-gpu" href="gpu.html">
                    <span class="step__state" data-state></span>
                    <span class="step__title" data-i18n="entry_gpu_title">訓練你的第一個影像分類模型</span>
                    <span class="step__desc" data-i18n="entry_gpu_desc">用學校的 GPU，從我們準備好的範例開始，約 20 分鐘</span>
                </a>
            </li>
        </ol>
    </section>

    <!-- ZH: 送過訓練的人，引導自動讓位（流程條收起來）。
             不是永久拿掉 —— 這一行讓他隨時叫回來。 -->
    <p class="flow-reopen" id="flow-reopen" hidden>
        <button type="button" class="btn--minor" id="flow-show"
                data-i18n="idx_flow_show">重新看引導</button>
    </p>

    <!-- ZH: 層級 3 · 隨時可以去。
         ZH: ⚠ 這裡**不放「問 AI」與「實驗室」** —— 前者是上方的主要動作、
             後者是流程的第三步。同一頁兩個入口通往同一個地方是雜訊不是方便
             （擁有者裁定 2026-08-21，同一條規則也適用於這裡）。 -->
    <nav class="minor" aria-labelledby="anytime-h">
        <h2 class="minor__h" id="anytime-h" data-i18n="idx_anytime_h">隨時可以去</h2>
        <a href="datasets.html" data-i18n="nav_datasets">我的資料集</a>
        <a href="jobs.html" data-i18n="nav_jobs">我的訓練</a>
        <a href="#" id="link-usage" data-i18n="acct_usage">使用量明細</a>
        <a href="#" id="link-report" data-i18n="acct_report">問題回報</a>
    </nav>
</main>

<script src="docs-entry.js?v=4fa954e4"></script>
<script src="i18n.js?v=bc17c7f6"></script>
<script src="prefs.js?v=a25a96d6"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=61a7acaa"></script>
<script src="chrome.js?v=bbebeb51"></script>
<script src="app.js?v=72318ae8"></script>
</body>
</html>
