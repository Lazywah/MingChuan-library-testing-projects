<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="myai_title">體驗大模型 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=13de82fd">
    <link rel="stylesheet" href="web.css?v=dbf03a13">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')==='1')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。 -->
</header>

<main class="page page--narrow">

    <!-- ==================================================================
         ZH: MYAI 專屬頁（v3.9，擁有者裁定 2026-08-30）。

         ZH: 這一整塊原本是**首頁的層級 1**。搬出來的理由：導覽列上「體驗大模型」
             與「首頁」原本指向同一個地方 —— 名字與去處不一致，點下去會意外。
             現在它有自己的落點，兩個選單項各自去各自的地方。

         ZH: ⚠ 搬家不是複製：首頁已經**沒有**額度卡了。兩邊都放的話就是
             同一份狀態機的兩份實作，而它們遲早會分岔（而且分岔時沒有錯誤訊息）。

         ZH: ⚠ 初始密碼提示（「你的 MYAI 初始密碼還沒改」）跟著搬過來了 ——
             它本來就掛在 #handoff 裡。代價是**沒來過這一頁的人不會被提醒**；
             要補的話應該是在首頁另做一條獨立的提示，不是把整張卡複製回去。
         ================================================================== -->
    <!-- ZH: ⚠ `id="balance-card"` 是**兩個東西的掛勾**，不是裝飾：
             myai.js 用它掛 data-low（額度偏低／用完時整張卡變色），
             web.css 用它給 .balance__meta 與 .handoff 裡的連結上樣式。
             漏掉的話 `$('balance-card')` 回 null，額度會**整段掉進錯誤分支**
             顯示「暫時取不到額度」—— 而 console 乾乾淨淨（例外被 catch 吃掉）。
             搬家時就漏掉過一次。 -->
    <section class="primary-card" id="balance-card" aria-labelledby="myai-title">
        <h1 class="hero__title" id="myai-title" data-i18n="grp_ai_t">體驗大模型</h1>
        <!-- ZH: 兩句話分兩行（擁有者裁定 2026-08-30）。第一句說「這是什麼」，
                 第二句說「能拿它做什麼」—— 擠成一段時，第二句會被當成第一句的尾巴。
             ZH: ⚠ 拆成兩個 data-i18n 而不是在字典裡塞 <br> ——
                 prefs.js 用 textContent 寫入，標籤會原樣顯示出來（見 rp_news_plain 的教訓）。
                 與 gpu.html 的 hero__sub 同一套做法。 -->
        <p class="hero__sub">
            <span data-i18n="myai_sub1">學校採購的 MYAI 教育平台。</span><br>
            <span data-i18n="myai_sub2">可以聊天、問問題、幫你寫東西和整理文件。</span>
        </p>

        <div class="balance__label" id="balance-label" data-i18n="bal_label">我的 AI 額度</div>

        <div class="balance__value">
            <span id="balance-value"><span class="skeleton" aria-hidden="true"></span></span><span
                class="balance__unit" id="balance-unit" hidden>Token</span>
        </div>

        <!-- ZH: 文案要講明真實結果。實際流程是「開廠商登出頁 → 1 秒後轉登入頁」，
                 落地是登入表單不是對話框。 -->
        <button class="btn btn--primary" id="go-myai" type="button" data-i18n="idx_go_myai">
            前往 MYAI 問 AI
        </button>

        <!-- ZH: 額度提示（「額度已用完 · 看用在哪 · 向管理員申請額度」）在按鈕下面。
                 卡片由上到下是「數字 → 主要動作 → 補充說明」，一層一件事。 -->
        <div class="balance__meta" id="balance-meta"></div>
        <div class="handoff" id="handoff" hidden></div>
    </section>

    <!-- ZH: 卡住時的出口。只在「還沒開通」與「狀態讀不到」兩種情況顯示 ——
             那兩種的共同點是**使用者在這裡沒有下一步可走**。
         ZH: 「已確認／逾期」不顯示：那不是故障，給回報入口只會製造無效工單。 -->
    <nav class="minor" id="stuck" hidden>
        <a href="report.html" data-i18n="prov_report">一直沒開通？回報給我們</a>
    </nav>

    <!-- ==================================================================
         ZH: 初始密碼（v3.9 從 provision.html 併進來，擁有者裁定 2026-08-30）。

         ZH: 併過來的理由：拿到密碼之後要做的事**就是上面那顆「前往 MYAI」**，
             原本那顆在另一頁，於是使用者得記住密碼、換頁、再登入。

         ZH: ⚠ 這裡**沒有**第二顆「前往 MYAI」。provision.html 上有一顆，
             是因為那一頁沒有別的出口；併進來之後再放一顆，
             同一畫面就有兩顆一模一樣的主要動作。

         ZH: 🔴 「我已經改好密碼了」會**立即銷毀**伺服器上暫存的密碼，不等保留期到 ——
             誤按了我們救不了（只能請他走 MYAI 的忘記密碼）。所以它是次要動作（白），
             而且排在主要動作**下面**：最醒目的必須是「去改密碼」，
             那才是他這一刻該做的事。

         ZH: ⚠ 沒有密碼可看時（已確認／逾期）**整區不出現，也不留訊息**。
             provision.html 會說「目前沒有可顯示的初始密碼」，那是因為
             使用者是**特地**點進那一頁的；在這一頁，絕大多數人本來就沒有密碼，
             每次進來都讀一次「你沒有密碼」是噪音。
         ================================================================== -->
    <section class="panel" id="pw-card" hidden aria-labelledby="pw-h">
        <h2 class="chart__title" id="pw-h" data-i18n="prov_h1">你的 MYAI 初始密碼</h2>
        <p class="footnote" id="pw-intro"></p>

        <div class="kv">
            <span class="kv__k" data-i18n="label_account">帳號</span>
            <span class="kv__v" id="acct">—</span>
        </div>

        <!-- ZH: 使用者就是為了這一行來的。
                 user-select:all 讓剪貼簿不可用時仍能一鍵選取（v1.5 的做法，沿用）。
             ZH: 「複製密碼」在這一列的尾端 —— 它是**這個欄位的動作**，
                 不是這一頁的動作。 -->
        <div class="kv kv--pw">
            <span class="kv__k" id="pw-label" data-i18n="prov_initial_pw">初始密碼</span>
            <code class="kv__v kv__v--pw" id="pw">—</code>
            <button class="btn btn--minor kv__act" id="copy" type="button"
                    data-i18n="prov_copy">複製密碼</button>
        </div>

        <button class="btn btn--ghost btn--block" id="ack" type="button"
                data-i18n="prov_ack">我已經改好密碼了</button>
        <div class="handoff" id="pw-note" hidden></div>

        <!-- ZH: 回答的是「為什麼這裡不能改」，不是一個動作。 -->
        <p class="footnote" data-i18n="prov_how">改密碼的地方在 MYAI 平台本身，不在這裡。用上面的帳號密碼登入後即可修改。</p>
    </section>

</main>

<script src="docs-entry.js?v=131ee7af"></script>
<script src="i18n.js?v=05fef4e9"></script>
<script src="prefs.js?v=00b43387"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=6c6382a7"></script>
<script src="chrome.js?v=11c0fcb4"></script>
<script src="myai.js?v=cecae282"></script>
</body>
</html>
