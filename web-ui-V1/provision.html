<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="prov_title">你的 AI 帳號 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=25be4520">
    <link rel="stylesheet" href="web.css?v=138a0a08">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')!=='0')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->
</header>

<main class="page page--narrow">

    <!-- 訊息區：沒有密碼可看（未開通／已確認／逾期）與錯誤都落在這 -->
    <div class="inline-error" id="msg" hidden></div>

    <!-- ZH: 卡住時的出口。只在「還沒開通」與「狀態讀不到」兩種情況顯示 ——
             那兩種的共同點是**使用者在這裡沒有下一步可走**，
             而他來這一頁通常正是因為 AI 用不了。
         ZH: 已確認／逾期那種不顯示：那不是故障，給回報入口只會製造無效工單。 -->
    <nav class="minor" id="stuck" hidden>
        <a href="report.html" data-i18n="prov_report">一直沒開通？回報給我們</a>
    </nav>

    <section class="primary-card" id="card" hidden aria-labelledby="pw-label">
        <h1 class="hero__title" data-i18n="prov_h1">你的 MYAI 初始密碼</h1>
        <p class="hero__sub" id="intro"></p>

        <div class="kv">
            <span class="kv__k" data-i18n="label_account">帳號</span>
            <span class="kv__v" id="acct">—</span>
        </div>

        <!-- ZH: 層級 1 —— 使用者就是為了這一行來的。
                 user-select:all 讓剪貼簿不可用時仍能一鍵選取（v1.5 的做法，沿用）。
             ZH: v3.9 「複製密碼」移進這一列的尾端 —— 它是**這個欄位的動作**，
                 不是這一頁的動作。放在下面跟另外兩個按鈕排在一起時，
                 三顆按鈕看起來是同一組步驟，而它其實只是輔助。 -->
        <div class="kv kv--pw">
            <span class="kv__k" id="pw-label" data-i18n="prov_initial_pw">初始密碼</span>
            <code class="kv__v kv__v--pw" id="pw">—</code>
            <button class="btn btn--minor kv__act" id="copy" type="button"
                    data-i18n="prov_copy">複製密碼</button>
        </div>

        <!-- ZH: 🔴 順序是刻意的：**先「前往 MYAI」（黃、主要），才是「我已經改好」（白、次要）**。
                 「我已經改好密碼了」按下去會**立即銷毀**伺服器上暫存的密碼，不等保留期到 ——
                 而還沒去改密碼的人一旦誤按，我們救不了他（只能請他走 MYAI 的忘記密碼）。
                 舊版把它做成唯一的主要動作、「前往 MYAI」反而是卡片外的小連結，
                 於是視覺上最醒目的那一顆正好是那顆不可逆的。
                 現在最醒目的是「去改密碼」，那才是他這一刻該做的事。 -->
        <a class="btn btn--primary btn--block" href="#" id="go-myai"
           data-i18n="prov_go_myai">前往 MYAI</a>
        <button class="btn btn--ghost btn--block" id="ack" type="button"
                data-i18n="prov_ack">我已經改好密碼了</button>
        <div class="handoff" id="note" hidden></div>
    </section>

    <!-- ZH: 「前往 MYAI」原本埋在這個句子中間，實測高 18px——全站最小的可點目標；
             後來抽成獨立按鈕，v3.9 再移進卡片內成為主要動作（見上面）。
             這一句留著 —— 它回答的是「為什麼這裡不能改」，不是一個動作。 -->
    <p class="hint" id="how" hidden>
        <span data-i18n="prov_how">改密碼的地方在 MYAI 平台本身，不在這裡。用上面的帳號密碼登入後即可修改。</span>
    </p>

</main>

<script src="i18n.js?v=86e76561"></script>
<script src="prefs.js?v=a25a96d6"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=61a7acaa"></script>
<script src="chrome.js?v=aaf2ae42"></script>
<script src="provision.js?v=ac7e2054"></script>
</body>
</html>
