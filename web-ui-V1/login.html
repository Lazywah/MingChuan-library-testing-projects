<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="login_title">登入 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=607ca155">
    <link rel="stylesheet" href="web.css?v=d376c851">
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 中／英切換（v3.9 補上）。
             這一頁**不載 chrome.js**，而其他頁的滑條是 chrome.js 產生的 ——
             所以登入頁一直沒有它。只看得懂英文的人在這一頁完全沒有辦法切語言，
             而這正是他遇到的第一個畫面。

         ZH: 放在色系切換**左邊**：色系是開發期的東西，上線會整塊移除
             （Decision Log #16）。放左邊的話，移除之後這顆會落在最右邊 ——
             與其他頁「語言在最右邊那組控制項裡」一致。

         ZH: 不接任何事件，也不用自己設 aria-pressed —— prefs.js 有 document 層的
             委派負責點擊，applyLang() 會重畫所有 [data-set-lang]。
             ⚠ 這與 chrome.js 那份不同：那邊的按鈕是**在 applyLang 跑完之後**
             才建出來的，所以要自己算初始值；這裡的按鈕在 HTML 裡，早就存在了。 -->
    <div class="lang-switch">
        <button type="button" data-set-lang="zh" aria-pressed="true"
                data-i18n-aria="prefs_lang_zh" aria-label="切換成中文">中</button>
        <button type="button" data-set-lang="en" aria-pressed="false"
                data-i18n-aria="prefs_lang_en" aria-label="切換成英文">EN</button>
    </div>

    <!-- ZH: 開發期的色系切換。上線擇一後整塊移除（Decision Log #16）。 -->
    <div class="theme-switch" role="group" aria-label="色系" data-i18n-aria="theme_aria">
        <button type="button" data-set-theme="yellow" aria-pressed="true" data-i18n="theme_yellow">黃</button>
        <button type="button" data-set-theme="blue" aria-pressed="false" data-i18n="theme_blue">藍</button>
    </div>
</header>

<main class="page page--narrow">

    <!-- 層級 1 · 這是什麼（給第一次來的人）—— 線框只允許這一項在第一眼 -->
    <section class="primary-card" aria-labelledby="hero-title">
        <h1 class="hero__title" id="hero-title" data-i18n="login_h1">銘傳大學圖書館 AI 基地</h1>
        <p class="hero__sub"><span data-i18n="login_sub">請用 Moodle 帳號密碼登入，可使用付費版 AI 工具和 GPU 訓練模型。拿到臨時帳號的校外人士請用下方的帳號密碼登入。</span></p>

        <!-- ZH: v4.20 測試期公告（擁有者 2026-09-21）。放在按鈕**之前** ——
                 放後面的話，登入被回絕的人要先失敗一次才看得到原因。
                 測試結束就把這一段與 i18n 的 login_testing 一起拿掉。 -->
        <p class="handoff" id="testing-note" data-i18n="login_testing">目前是測試階段，暫不開放自行建立帳號。只有管理者已經建立的帳號可以登入；需要帳號請聯絡圖書館 AI 基地管理者。</p>

        <!-- 主要動作（唯一）。載入中／錯誤都在這顆按鈕上表達，不用整頁 spinner。 -->
        <button class="btn btn--primary" id="go-sso" type="button" disabled data-i18n="login_sso">
            用 Moodle 帳號登入
        </button>
        <div class="handoff" id="sso-note" data-i18n="login_checking">正在確認登入方式…</div>
        <!-- ZH: v4.20 SSO 被回絕時的訊息。**自己一個元素** —— 借用 #sso-note 的話，
                 loadProviders() 回來時會把它覆蓋成空字串（實測踩過）。 -->
        <p class="inline-error" id="sso-error" hidden></p>
    </section>

    <!-- ZH: 層級 3 —— 帳號密碼登入。**預設收合，且錯誤時不自動展開**（C2 修正）：
             自動展開會把管理者通道曝光給學生，而 admin 本來就知道它在哪。
         ZH: v4.19 標題從「管理者本機登入」改成含臨時帳號（擁有者 2026-09-21）——
             校外人士拿到臨時帳號後只看得到「用 Moodle 帳號登入」，
             而唯一能用的那個入口寫著「管理者」，等於告訴他這裡沒有他的位置。 -->
    <details class="fold" id="admin-fold">
        <summary class="fold__summary" data-i18n="login_admin_fold">用帳號密碼登入（管理者、臨時帳號）</summary>

        <form class="fold__body" id="admin-form" autocomplete="on">
            <label class="field">
                <span class="field__label" for="admin-user" data-i18n="label_account">帳號</span>
                <input class="field__input" id="admin-user" name="username"
                       type="text" autocomplete="username" required>
            </label>

            <label class="field">
                <span class="field__label" for="admin-pass" data-i18n="label_password">密碼</span>
                <input class="field__input" id="admin-pass" name="password"
                       type="password" autocomplete="current-password" required>
            </label>

            <button class="btn btn--ghost" id="admin-submit" type="submit" data-i18n="btn_login">登入</button>
            <div class="inline-error" id="admin-error" hidden></div>

            <a class="fold__link" href="#" id="forgot" data-i18n="login_forgot">忘記密碼</a>
        </form>
    </details>

</main>

<script src="i18n.js?v=3068d20b"></script>
<script src="prefs.js?v=e71609e5"></script>
<!-- ZH: 小基（浮動助手）**不放在登入頁**（擁有者 2026-09-20）：未登入就能對話等於
         匿名洗對話、燒 Ollama 算力。原本的設計是「不會登入時想直接問」——
         那個需求改由登入頁的說明文字與「問題回報」承接。
         ⚠ /api/v1/assistant/ask 本身仍是公開端點（30 次/分限流），
         這裡拿掉的是入口，不是後端；要連 API 都鎖要另外改 assistant.py。 -->
<script src="jump.js?v=05008986"></script>
<script src="login.js?v=55f37431"></script>
</body>
</html>
