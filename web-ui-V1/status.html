<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="gs_title">GPU 現在忙不忙 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=2afb656c">
    <link rel="stylesheet" href="web.css?v=bd588ac0">
    <!-- ZH: 側欄狀態必須在首次繪製之前套用（說明同 usage.html）。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')==='1')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
</header>

<main class="page">

    <!-- ZH: 🔴 第一句話要回答他進來的那個問題：「我現在能不能用？」
             卡片細節是第二層 —— 先給結論，再給理由。
         ZH: 這一頁存在的理由：在它之前，任務排著不動時使用者只能來問人，
             而「是誰佔著、還要多久」系統本來就知道。 -->
    <section class="primary-card" aria-labelledby="gs-head">
        <h1 class="hero__title" id="gs-head" data-i18n="gs_head">GPU 現在忙不忙</h1>
        <p class="hero__sub" id="gs-verdict"><span class="skeleton" aria-hidden="true"></span></p>
        <p class="hero__sub" id="gs-next" hidden></p>
    </section>

    <div class="inline-error" id="gs-msg" hidden></div>

    <div id="gs-body" hidden>
        <!-- 每張卡 -->
        <section aria-labelledby="gs-cards-h">
            <h2 class="sec__title" id="gs-cards-h" data-i18n="gs_cards_h">每張卡現在在做什麼</h2>
            <div id="gs-cards" class="gpuwall"></div>
            <p class="gpuwall__note" data-i18n="gs_privacy">
                為了不互相催促，這裡不顯示是誰在用；只有你自己的任務會標出名稱。
            </p>
        </section>

        <!-- 佇列 -->
        <section aria-labelledby="gs-queue-h">
            <h2 class="sec__title" id="gs-queue-h" data-i18n="gs_queue_h">排隊中的訓練任務</h2>
            <p id="gs-queue"></p>
            <ul id="gs-mine" class="gs-mine"></ul>
        </section>

        <!-- 節點 -->
        <section aria-labelledby="gs-nodes-h">
            <h2 class="sec__title" id="gs-nodes-h" data-i18n="gs_nodes_h">機器狀態</h2>
            <div id="gs-nodes" class="gpuwall"></div>
        </section>

        <p class="gpuwall__note" id="gs-asof"></p>
    </div>

</main>

<!-- ZH: chrome.js 的導覽會問 DocsEntry 要不要顯示文件庫入口，所以要先載它。 -->
<script src="docs-entry.js?v=131ee7af"></script>
<script src="i18n.js?v=efe65b4b"></script>
<script src="prefs.js?v=e71609e5"></script>
<script src="tip.js?v=0699f4a2"></script>
<script src="assistant-widget.js?v=74e3c4b6"></script>
<!-- ZH: 🔴 時間一律走 tz.js：後端回的時間字串**沒有時區標記**（SQLite 取回是 naive UTC），
         瀏覽器的 new Date() 會把它當本地時間，於是 +08:00 的人看到的時間早了 8 小時。
         少載這一支的症狀是「最後心跳」與「更新於」差整整 8 小時（實際踩到過）。 -->
<script src="tz.js?v=2e214a8b"></script>
<script src="chrome.js?v=38b95e44"></script>
<script src="status.js?v=6eedccd1"></script>
<!-- ZH: 到訪人次。每一頁都載（這是「網站」的計數，不是首頁的），
         一個工作階段只送一次；只有放了 [data-visits] 的頁面會顯示數字。 -->
<script src="visits.js?v=fc7abe51"></script>
<!-- ZH: 引導導覽。每一頁都載是因為它**跨頁**（首頁→MYAI→訓練→實驗室），
         換頁之後要接著演。它自己會等 chrome.js 的 `chrome:ready`，
         沒登入就什麼都不做。 -->
<script src="tour.js?v=20dcb611"></script>
</body>
</html>
