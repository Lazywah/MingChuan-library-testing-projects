<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="rep_title">問題回報 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=e6a0b3ae">
    <link rel="stylesheet" href="web.css?v=f8743f76">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')!=='0')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->
</header>

<main class="page page--narrow">

    <section class="primary-card" aria-labelledby="rep-title">
        <h1 class="hero__title" id="rep-title" data-i18n="rep_h1">問題回報</h1>

        <!-- ZH: v3.4 —— 送出鈕接上了真正的後端（POST /api/v1/reports）。
                 送出之後管理者在管理介面看得到，回覆會出現在下方「我的回報」。
                 ⚠ 不寄信、不通知：使用者要自己回這一頁看回應。文案必須講清楚，
                   不然他會以為會有人主動聯絡他。 -->
        <p class="hero__sub">
            <span data-i18n="rep_sub1">送出後管理者會在管理介面看到。</span><strong data-i18n="rep_sub2">不會另外寄信通知你</strong><span data-i18n="rep_sub3">—— 回覆會出現在這一頁下方的「我的回報」。</span>
        </p>

        <!-- ZH: v3.9 主旨與類別。順序是刻意的：先分類、再一句話、最後才是細節。
                 管理端的清單一列就是「類別＋主旨」，先填的兩欄正好是被看見的那兩欄。 -->
        <label class="field">
            <span class="field__label" for="cat" data-i18n="rep_cat">這是關於什麼</span>
            <select class="field__input" id="cat"></select>
        </label>

        <label class="field">
            <span class="field__label" for="subject" data-i18n="rep_subject">主旨</span>
            <input class="field__input" type="text" id="subject" maxlength="120"
                   data-i18n-placeholder="rep_subject_ph" placeholder="一句話說明，例：前往 MYAI 後是空白頁">
        </label>

        <label class="field">
            <span class="field__label" for="what" data-i18n="rep_what">發生了什麼事</span>
            <textarea class="field__input" id="what" rows="5" maxlength="4000"
                      data-i18n-placeholder="rep_ph" placeholder="例：按下「前往 MYAI」之後新分頁是空白的，重試三次都一樣。"></textarea>
        </label>

        <button class="btn btn--primary" id="send" type="button" data-i18n="rep_send">送出回報</button>
        <!-- ZH: 複製鈕**保留**。後端掛掉、或使用者當下沒登入時，
                 「複製後自己交出去」仍是唯一走得通的路——把降級路徑砍掉不划算。 -->
        <button class="btn btn--ghost" id="copy" type="button" data-i18n="rep_copy">改用複製，自己交給管理者</button>
        <div class="handoff" id="note" hidden></div>
    </section>

    <h2 class="chart__title" data-i18n="rep_diag_title">會一起送出的診斷資訊</h2>
    <!-- ZH: 全部攤開來給使用者看。要別人交出診斷資訊，就不能讓他不知道交了什麼。
             ⚠ 後端**不會**再補上任何這裡沒列出的欄位（含 IP）——
               見 job-scheduler/app/models.py 的 IssueReport 註解。 -->
    <pre class="diag" id="diag" data-i18n="rep_preparing">整理中…</pre>

    <h2 class="chart__title" data-i18n="rep_mine">我的回報</h2>
    <div id="mine">
        <span class="skeleton skeleton--line"></span>
        <span class="skeleton skeleton--line"></span>
    </div>

</main>

<script src="tz.js?v=2e214a8b"></script>
<script src="i18n.js?v=c725f6c8"></script>
<script src="prefs.js?v=a25a96d6"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=61a7acaa"></script>
<script src="chrome.js?v=a7562341"></script>
<script src="report.js?v=05adbf26"></script>
</body>
</html>
