<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="gpu_title">訓練你的第一個模型 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=d4d21ce8">
    <link rel="stylesheet" href="web.css?v=e84e8189">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')==='1')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand" data-i18n="brand">銘傳圖書館 AI 學習基地</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->
</header>

<main class="page page--narrow">

    <!-- 層級 1 · 做完會得到什麼 + 需要準備什麼。這兩句是這個畫面存在的理由。 -->
    <section class="primary-card" aria-labelledby="gpu-title">
        <!-- ZH: v4.19 三選一範例（擁有者 2026-09-20）。選哪一種決定：標題、說明、流程預覽第 1／3 步，
                 以及下面三張方式卡帶到訓練頁的種類（v4.36）。清單的真相在 gpu.js 的 KINDS。 -->
        <div class="seg" role="group" aria-label="範例種類" data-i18n-aria="gpu_kind_aria" id="kind-seg">
            <button type="button" data-kind="cats_dogs" aria-pressed="true" data-i18n="gpu_kind_cats">貓狗圖片</button>
            <button type="button" data-kind="tabular" aria-pressed="false" data-i18n="gpu_kind_tab">學生及格表格</button>
            <button type="button" data-kind="text" aria-pressed="false" data-i18n="gpu_kind_text">餐廳評論文字</button>
        </div>
        <h1 class="hero__title" id="gpu-title" data-i18n="gpu_h1">做出一個能分辨貓和狗的模型</h1>
        <p class="hero__sub">
            <span id="gpu-sub1" data-i18n="gpu_sub1">用學校的 GPU，訓練通常不到一分鐘。</span><br>
            <span data-i18n="gpu_pick_mode">選一種開始的方式：</span>
        </p>

        <!-- ZH: v4.36 三種方式（擁有者 2026-10-02，接管者回饋 2026-09-30）。
             ZH: 🔴 這裡**推翻了擁有者 2026-08-20 的裁定**（「學習程式碼」主要按鈕＋
                 「不想看程式」次要按鈕，理由是兩顆同權重會讓第一次來的人不知道按哪個）。
                 新的裁定：初學者與有資料／有程式的人都是正式對象，所以**不分主次**；
                 改用「由淺到深往下排＋每張卡寫明是給誰的」讓人知道該按哪個，
                 而不是靠顏色告訴他「你應該是哪一種人」。
             ZH: 「學習程式碼」不再是入口 —— 改成訓練結果下方的一段說明，
                 告訴有興趣的人怎麼到程式實驗室看那支程式（擁有者：不要連結，純說明）。
             ZH: 三張卡共用上面選的種類；連結的 ?task= 由 gpu.js 的 setKind 填。
                 卡片沿用 .gcard（同一個平台不要有兩種卡片長相）。 -->
        <nav class="modes" aria-label="開始的方式" data-i18n-aria="gpu_modes_aria">
            <a class="gcard" data-mode="easy" href="train.html?mode=easy">
                <span class="gcard__t" data-i18n="gpu_mode_easy_t">先體驗看看</span>
                <span class="gcard__d" data-i18n="gpu_mode_easy_d">第一次來。用平台準備好的範例，按一下就開始。</span>
            </a>
            <a class="gcard" data-mode="normal" href="train.html?mode=normal">
                <span class="gcard__t" data-i18n="gpu_mode_normal_t">用自己的資料</span>
                <span class="gcard__d" data-i18n="gpu_mode_normal_d">有一包整理好的資料。平台幫你訓練，不用寫程式。</span>
            </a>
            <a class="gcard" data-mode="hard" href="train.html?mode=hard">
                <span class="gcard__t" data-i18n="gpu_mode_hard_t">用自己的程式</span>
                <span class="gcard__d" data-i18n="gpu_mode_hard_d">會寫訓練程式。上傳 .py，借學校的 GPU 跑。</span>
            </a>
        </nav>
    </section>

    <!-- 層級 2 · 三步驟預覽（純說明、不可點）。
         ZH: 用 <ol> 而非按鈕，因為它們不是入口，是預期管理。
         ZH: v3.9 包成卡片（與 lab 頁同一款盒子）。原本這三步直接浮在主卡下面，
             看起來像「卡片下面掉出來的東西」。 -->
    <section class="panel steps-card">
    <ol class="steps" aria-label="流程預覽" data-i18n-aria="gpu_steps_aria">
        <li class="steps__item">
            <span class="steps__n">1</span>
            <span class="steps__t" data-i18n="gpu_s1t">準備資料</span>
            <span class="steps__d" id="gpu-s1d" data-i18n="gpu_s1d">每個類別一個資料夾。用範例的話這步跳過。</span>
        </li>
        <li class="steps__item">
            <span class="steps__n">2</span>
            <span class="steps__t" data-i18n="gpu_s2t">平台幫你訓練</span>
            <span class="steps__d" data-i18n="gpu_s2d">排隊、訓練到結果，都在同一頁看得到。</span>
        </li>
        <li class="steps__item">
            <span class="steps__n">3</span>
            <span class="steps__t" data-i18n="gpu_s3t">看結果</span>
            <span class="steps__d" id="gpu-s3d" data-i18n="gpu_s3d">正確率、以及模型判斷錯的那幾張圖。</span>
        </li>
    </ol>
    </section>

    <!-- ZH: v4.36 原本這裡有「磁碟配額」—— 那是**程式實驗室**的配額，入口頁不再開實驗室，
             放著只會被當成「上傳資料的上限」（那是另一個數字：每人 2 GB，寫在訓練頁的上傳區）。 -->

</main>

<script src="docs-entry.js?v=131ee7af"></script>
<script src="tz.js?v=2e214a8b"></script>

<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=74e3c4b6"></script>
<script src="chrome.js?v=9368462b"></script>
<script src="gpu.js?v=e30f8d5e"></script>
<!-- ZH: 到訪人次。每一頁都載（這是「網站」的計數，不是首頁的），一個工作階段只送一次；
         只有放了 [data-visits] 的頁面（登入頁、首頁）會顯示數字。 -->
<script src="visits.js"></script>
<!-- ZH: 引導導覽。每一頁都載是因為它**跨頁**（首頁→MYAI→訓練進度→使用量→問題回報），
         換頁之後要接著演。它自己會等 chrome.js 的 `chrome:ready`，
         沒登入就什麼都不做。 -->
<script src="tour.js?v=56225431"></script>
</body>
</html>
