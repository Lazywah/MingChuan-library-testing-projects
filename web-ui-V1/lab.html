<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="lab_title">我的程式實驗室 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=13de82fd">
    <link rel="stylesheet" href="web.css?v=5dc25bc8">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')==='1')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->
</header>

<main class="page page--narrow">

    <!-- 層級 1 · 現在是什麼狀態 + 唯一的動作 -->
    <section class="primary-card" aria-labelledby="lab-title">
        <!-- ZH: v3.9 全頁的補充說明集中在這一個 icon（擁有者裁定 2026-08-30）。
                 原本散在三個地方（存檔標題旁、環境變數那一行、封存說明），
                 每一個都只放一句 —— 三顆小圓圈本身就是視覺雜訊，
                 而且使用者要一個一個點才知道各是什麼。
             ZH: 裡面的三段各自可以缺席（環境變數要有注入才有、封存天數讀不到就沒有），
                 由 lab.js 控制。**三段都沒有時整個 icon 不出現** ——
                 點開是空的比沒有 icon 更糟。 -->
        <!-- ZH: ⚠ `id` 在**內層的 span** 上，不在 <h1> 本身 ——
                 卡片用 aria-labelledby 指著它。留在 h1 上的話，
                 螢幕閱讀器唸出來的卡片名稱會變成「我的程式實驗室 這是什麼」
                 （icon 按鈕的 aria-label 被算進可及名稱）。 -->
        <h1 class="hero__title">
            <span id="lab-title" data-i18n="lab_h1">我的程式實驗室</span>
            <span class="tip" id="lab-tip">
                <button type="button" class="tip__btn" aria-expanded="false"
                        aria-controls="lab-tip-body" data-i18n-aria="tip_more" aria-label="這是什麼">i</button>
                <span class="tip__body tip__body--wide" id="lab-tip-body" role="tooltip" hidden>
                    <span class="tip__item">
                        <b data-i18n="lab_gpu_h">關於 GPU</b>
                        <span data-i18n="lab_gpu_tip">訓練模型才需要勾。不勾一樣可以寫程式、裝套件。用完請關閉實驗室，讓給下一位。</span>
                    </span>
                    <span class="tip__item">
                        <b data-i18n="ws_title">我的存檔</b>
                        <span data-i18n="ws_sub">可以有好幾份各自獨立的工作區。一次只開一份——切換時舊的會關閉，檔案都保留。</span>
                    </span>
                    <span class="tip__item" id="tip-secrets" hidden>
                        <b data-i18n="lab_env_h">啟動時會注入你的環境變數</b>
                        <span id="secrets"></span>
                    </span>
                    <span class="tip__item" id="tip-archive" hidden>
                        <b data-i18n="lab_archive_h">存檔的保留</b>
                        <span id="archive-note"></span>
                    </span>
                </span>
            </span>
        </h1>
        <p class="hero__sub"><span data-i18n="lab_sub">瀏覽器裡的 VS Code。檔案永久保留，閒置一段時間會自動關閉。</span></p>

        <div class="kv">
            <span class="kv__k" data-i18n="lab_state">狀態</span>
            <span class="kv__v" id="state" data-i18n="loading">讀取中…</span>
        </div>

        <!-- ZH: D3 —— 容器要 5–10 秒。**同頁顯示啟動進度，就緒後才開新分頁**；
                 直接開新分頁會看到空白，那比等待更糟（使用者不知道是壞了還是還沒好）。 -->
        <button class="btn btn--primary" id="go" type="button" disabled data-i18n="loading">讀取中…</button>
        <!-- ZH: v3.9 互動式 GPU。**預設不勾** —— 全校一張卡，勾了就佔住，
                 大多數人只是寫程式、不需要它。刻意做成要主動勾。 -->
        <label class="lab-gpu" id="gpu-wrap" hidden>
            <input type="checkbox" id="gpu-opt">
            <span data-i18n="lab_gpu_label">這次要用 GPU（訓練模型才需要）</span>
        </label>
        <!-- ZH: v3.9 這裡原本有一句「全校只有一張卡，同時只能一個人用…」。
                 **拿掉了（擁有者裁定 2026-08-30）** —— 它把一個會過期的部署事實
                 寫進了介面文案：台北的節點接上之後就不只一張，
                 而那時候沒有人會想起來要回頭改這句話。
             ZH: 借不到卡時後端本來就會講出**當下**的原因（GpuBusyError），
                 那是查出來的事實，不會過期。剩下不會過時的說明併進標題旁的 icon。 -->
        <div class="handoff" id="note" hidden></div>

        <!-- ZH: v3.9 「關閉實驗室」從頁尾的 .minor 搬進狀態卡。
                 它是這一頁的**第二動作**，而且佔著 GPU 時是最該被看見的那一個 ——
                 放在頁尾要捲過存檔清單才找得到。
             ZH: 做成文字連結不是按鈕：卡片裡已經有一顆主要動作，
                 兩顆實心鈕並排會分不出主次（與首頁額度卡同一條規則）。 -->
        <p class="card-action"><a href="#" id="stop" hidden data-i18n="lab_stop">關閉實驗室</a></p>
    </section>

    <!-- 層級 2 · 這次 session 的事實 -->
    <!-- ZH: v3.9 包成卡片，與上面的狀態卡、下面的存檔卡同一個盒子。
             原本這三個數字直接浮在兩張卡中間，看起來像「卡片之間掉出來的東西」。
         ZH: ⚠ `id="meta"` 與 `hidden` 都在**外層**：lab.js 用 `$('meta').hidden = false`
             解除隱藏，掛在內層的話載入前後會先出現一個空盒子。 -->
    <section class="panel stats-card" id="meta" hidden>
      <div class="stats">
        <div class="stat">
            <div class="stat__label" data-i18n="lab_left_today">今日剩餘時間</div>
            <div class="stat__value" id="m-remaining">—</div>
        </div>
        <!-- ZH: 「已執行」只有跑起來才有意義，所以它自己會隱藏；
                 另外兩格停止時照樣顯示（見 lab.js 的說明）。 -->
        <div class="stat" id="m-elapsed-wrap">
            <div class="stat__label" data-i18n="lab_running_for">已執行</div>
            <div class="stat__value" id="m-elapsed">—</div>
        </div>
        <div class="stat">
            <!-- ZH: 標籤從「磁碟配額」改成「磁碟」—— 這一格現在顯示的是
                     「用了多少 / 上限多少」，只寫配額會對不上內容。 -->
            <div class="stat__label" data-i18n="lab_disk">磁碟</div>
            <div class="stat__value" id="m-quota">—</div>
        </div>
      </div>
    </section>


    <!-- ==================================================================
         ZH: 多份存檔。放在狀態卡**下面** —— 只有一份的人（現在所有人）
             第一眼看到的仍然是「狀態 + 開啟」，這裡在他建第二份之前只是一列。
         ZH: ⚠ 一次只開一份。切換＝關掉舊的開新的，**檔案全部保留**——
             這句話一定要寫在畫面上，不然使用者會以為舊的壞了。
         ================================================================== -->
    <!-- ZH: v3.9 包成卡片。原本標題／說明／清單／按鈕四個元素直接貼在頁面上，
             與上面那張卡不成套 —— 看起來像「卡片下面散落著一些東西」。 -->
    <section class="panel" aria-labelledby="ws-title">
        <h2 class="chart__title" id="ws-title" data-i18n="ws_title">我的存檔</h2>
        <div id="ws-list" aria-live="polite">
            <span class="skeleton skeleton--line"></span>
        </div>
        <div class="ds__actions">
            <button class="btn btn--minor" type="button" id="ws-new" data-i18n="ws_new">新增一份存檔</button>
            <span class="footnote" id="ws-count"></span>
        </div>
    </section>

    <!-- 層級 3 · 降級的動作 -->
    <nav class="minor">
        <a href="gpu.html" data-i18n="lab_first_time">第一次用？看「訓練你的第一個模型」</a>
    </nav>

</main>

<script src="tz.js?v=2e214a8b"></script>
<script src="docs-entry.js?v=131ee7af"></script>
<script src="i18n.js?v=bec7665d"></script>
<script src="prefs.js?v=00b43387"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=74e3c4b6"></script>
<script src="tip.js?v=0699f4a2"></script>
<script src="chrome.js?v=9a7f30b4"></script>
<script src="lab.js?v=64c1222b"></script>
</body>
</html>
