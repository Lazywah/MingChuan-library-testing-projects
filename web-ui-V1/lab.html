<!DOCTYPE html>
<html lang="zh-Hant" data-theme="yellow">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="lab_title">我的程式實驗室 · MCU AI Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css?v=ff9cecda">
    <link rel="stylesheet" href="styles.css?v=e6a0b3ae">
    <link rel="stylesheet" href="web.css?v=e8f673d2">
    <!-- ZH: 🔴 側欄狀態必須在**首次繪製之前**套用，否則每換一頁都會看到
             內容滑出去讓位（widget 的 JS 在 body 尾端才跑，那時已經畫過一次了）。
             這一段刻意內嵌而不是外部檔案 —— 外部檔案要等網路往返，
             那段時間頁面就是沒有 padding 的樣子，位移照樣看得到。
         ZH: 與 CSS 的對應：`html.aibot-docked body { padding-right: … }`。
             key 與 assistant-widget.js 的 DOCK_KEY 相同，改一邊要改兩邊。 -->
    <script>try{if(localStorage.getItem('ai_hud_bot_open')!=='0')document.documentElement.classList.add('aibot-docked')}catch(e){}</script>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">MCU AI Base</span>
    <span class="topbar__spacer"></span>
    <!-- ZH: 導覽與帳號選單由 chrome.js 產生（唯一真相來源）。
             版面：只有 LOGO 在左，其餘全部靠右。 -->
</header>

<main class="page page--narrow">

    <!-- 層級 1 · 現在是什麼狀態 + 唯一的動作 -->
    <section class="primary-card" aria-labelledby="lab-title">
        <h1 class="hero__title" id="lab-title" data-i18n="lab_h1">我的程式實驗室</h1>
        <p class="hero__sub"><span data-i18n="lab_sub">瀏覽器裡的 VS Code。檔案永久保留，閒置一段時間會自動關閉。</span></p>

        <div class="kv">
            <span class="kv__k" data-i18n="lab_state">狀態</span>
            <span class="kv__v" id="state" data-i18n="loading">讀取中…</span>
        </div>

        <!-- ZH: D3 —— 容器要 5–10 秒。**同頁顯示啟動進度，就緒後才開新分頁**；
                 直接開新分頁會看到空白，那比等待更糟（使用者不知道是壞了還是還沒好）。 -->
        <button class="btn btn--primary" id="go" type="button" disabled data-i18n="loading">讀取中…</button>
        <!-- ZH: v3.9 互動式 GPU。**預設不勾** —— 全校一張卡，勾了就佔住，
                 大多數人只是寫程式、不需要它。刻意做成要主動勾。 -->
        <label class="lab-gpu" id="gpu-wrap" hidden>
            <input type="checkbox" id="gpu-opt">
            <span data-i18n="lab_gpu_label">這次要用 GPU（訓練模型才需要）</span>
        </label>
        <p class="footnote" id="gpu-hint" hidden data-i18n="lab_gpu_hint">GPU 全校只有一張，同時只能一個人用。用完請按「關閉實驗室」讓給下一位。不勾的話一樣可以寫程式、裝套件。</p>
        <div class="handoff" id="note" hidden></div>
    </section>

    <!-- 層級 2 · 這次 session 的事實 -->
    <div class="stats" id="meta" hidden>
        <div class="stat">
            <div class="stat__label" data-i18n="lab_left_today">今日剩餘時間</div>
            <div class="stat__value" id="m-remaining">—</div>
        </div>
        <!-- ZH: 「已執行」只有跑起來才有意義，所以它自己會隱藏；
                 另外兩格停止時照樣顯示（見 lab.js 的說明）。 -->
        <div class="stat" id="m-elapsed-wrap">
            <div class="stat__label" data-i18n="lab_running_for">已執行</div>
            <div class="stat__value" id="m-elapsed">—</div>
        </div>
        <div class="stat">
            <!-- ZH: 標籤從「磁碟配額」改成「磁碟」—— 這一格現在顯示的是
                     「用了多少 / 上限多少」，只寫配額會對不上內容。 -->
            <div class="stat__label" data-i18n="lab_disk">磁碟</div>
            <div class="stat__value" id="m-quota">—</div>
        </div>
    </div>

    <p class="hint" id="secrets" hidden></p>

    <!-- ==================================================================
         ZH: 多份存檔。放在狀態卡**下面** —— 只有一份的人（現在所有人）
             第一眼看到的仍然是「狀態 + 開啟」，這裡在他建第二份之前只是一列。
         ZH: ⚠ 一次只開一份。切換＝關掉舊的開新的，**檔案全部保留**——
             這句話一定要寫在畫面上，不然使用者會以為舊的壞了。
         ================================================================== -->
    <h2 class="chart__title" data-i18n="ws_title">我的存檔</h2>
    <p class="footnote" data-i18n="ws_sub">可以有好幾份各自獨立的工作區。一次只開一份——切換時舊的會關閉，檔案都保留。</p>
    <p class="footnote" id="archive-note" hidden></p>
    <div id="ws-list" aria-live="polite">
        <span class="skeleton skeleton--line"></span>
    </div>
    <div class="ds__actions">
        <button class="btn btn--minor" type="button" id="ws-new" data-i18n="ws_new">新增一份存檔</button>
        <span class="footnote" id="ws-count"></span>
    </div>

    <!-- 層級 3 · 降級的動作 -->
    <nav class="minor">
        <a href="#" id="stop" hidden data-i18n="lab_stop">關閉實驗室</a>
        <a href="gpu.html" data-i18n="lab_first_time">第一次用？看「訓練你的第一個模型」</a>
    </nav>

</main>

<script src="tz.js?v=2e214a8b"></script>
<script src="i18n.js?v=bc17c7f6"></script>
<script src="prefs.js?v=a25a96d6"></script>
<!-- ZH: 小基（浮動助手）。客服模式公開，登入頁也放 —— 設計文件的使用者需求是「不會用這個平台時想直接問」。 -->
<script src="assistant-widget.js?v=61a7acaa"></script>
<script src="chrome.js?v=b407389e"></script>
<script src="lab.js?v=a8862c84"></script>
</body>
</html>
