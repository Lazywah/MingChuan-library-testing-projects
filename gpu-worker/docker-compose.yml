services:
  gpu-worker:
    build: .
    container_name: mcu-gpu-worker
    restart: unless-stopped
    environment:
      # ================================================================
      # ⚠️ 服務層位址。本機與 scheduler 同機時走 ai-platform-net 用容器名（免猜 IP）；
      #    跨主機部署才改成服務層主機的真實 IP:Port（例：http://192.168.1.50:8002）。
      # When co-located, reach the scheduler by container name over ai-platform-net;
      # for a remote GPU host, override with the service-layer IP:Port.
      # ================================================================
      - SERVICE_LAYER_URL=${SERVICE_LAYER_URL:-http://ai-platform-scheduler:8000}

      # ZH: worker 的 API_TOKEN 必須等於服務層的 WORKER_API_TOKEN，否則 heartbeat/take 全 401（且無聲）。
      #     改用 :? fail-fast：沒帶 --env-file ../.env（＝沒提供 WORKER_API_TOKEN）就「大聲」啟動失敗，
      #     不再退回不安全的預設值造成靜默 401。請一律用本目錄的 ./start-worker.sh（.bat）啟動，它會自動帶 --env-file。
      # EN: Fail-fast — starting without --env-file ../.env (no WORKER_API_TOKEN) aborts loudly
      #     instead of falling back to an insecure default that causes a silent 401. Use ./start-worker.sh.
      - API_TOKEN=${WORKER_API_TOKEN:?WORKER_API_TOKEN not set - run ./start-worker.sh (bakes in --env-file ../.env) instead of a bare docker compose up}
      - NODE_ID=${NODE_ID:-gpu-node-01}                     # ZH: 此節點名稱（多台時請各自命名）
      # ZH: v3.0 此節點所屬池。本機 4060 維持 batch；日後服務層 RTX 5090 起 worker 設 interactive。
      # EN: v3.0 node pool. Keep batch for the local 4060; set interactive on the future 5090 worker.
      - POOL_TYPE=${POOL_TYPE:-batch}
      # ZH: v3.6 是否與服務層同機（看得到 per-user 的 home_<uid> volume）。
      #     ⚠ 這裡的預設 false 與 .env.example 的 true 不同，是刻意的：
      #       沒有 .env 就啟動 = 來歷不明 = 當成不同機（不派程式實驗室的任務）。
      # EN: v3.6 co-located with the service layer. Default false on purpose:
      #     an unknown deployment must not be given Code Lab jobs.
      - SHARES_SERVICE_STORAGE=${SHARES_SERVICE_STORAGE:-false}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}                   # ZH: 領取任務輪詢間隔 (秒)
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}        # ZH: 心跳上報間隔 (秒)
      # ZH: GPU 空閒判定門檻(%)。預設 90 適合本機/桌機（GPU 與 OS/瀏覽器/Ollama 共用，
      #     常態就有負載；門檻太低會讓 worker 一直判 GPU「忙」而不領任務、且無聲）。
      #     接專用 GPU 伺服器時再用 env 覆寫回低值（如 10）。
      # EN: GPU idle threshold(%). Default 90 suits a shared desktop GPU; a dedicated
      #     GPU server can override back to a low value (e.g. 10) via env.
      - GPU_IDLE_UTIL_THRESHOLD=${GPU_IDLE_UTIL_THRESHOLD:-90}
      - STORAGE_MOUNT_PATH=${STORAGE_MOUNT_PATH:-C:\storage} # ZH: 宿主機共享儲存路徑

    volumes:
      # ZH: 掛載 Docker Socket 以動態啟動訓練兄弟容器 (Sibling Container Pattern)
      # EN: Mount Docker socket to spawn sibling training containers
      - /var/run/docker.sock:/var/run/docker.sock

    # ZH: 加入 scheduler 所在網路，才能用容器名 ai-platform-scheduler 連線（免猜 IP）。
    # EN: Join the scheduler's network to reach it by container name.
    networks:
      - ai-platform-net

    # ZH: GPU 直通：允許 Worker 容器執行 nvidia-smi 查詢 GPU 使用率
    # EN: GPU passthrough: allows the Worker container to run nvidia-smi for utilisation polling
    # ZH: 注意：Worker 本身不執行訓練，僅需 utility 能力即可；訓練容器另行以 --gpus 啟動
    # EN: Note: Worker does not train; it only needs 'utility' capability for nvidia-smi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [utility]

# ZH: ai-platform-net 由主 docker-compose.yml 建立，這裡以 external 參照（不重建）。
# EN: ai-platform-net is created by the main compose; reference it as external here.
networks:
  ai-platform-net:
    external: true
    name: ai-platform-net
